<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TypeSlayer the Vampire Hunter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@500;600;700&display=swap">
<style>
  /* Single dark "moonlit graveyard" look on purpose: the game always plays at night. */
  :root {
    --night: #0d0a1a;
    --ink: #f4ecff;
    --gold: #ffcf5a;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--ink);
    overflow: hidden;
    font-family: Fredoka, "Trebuchet MS", system-ui, sans-serif;
  }
  #game { width: 100%; height: 100%; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    font-size: 20px; color: var(--gold);
  }
</style>

<div id="game"></div>
<div id="loading">Sharpening crossbow bolts…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="assets.js"></script>
<script src="skins.js"></script>
<script src="scenes.js"></script>
<script src="enemies.js"></script>
<script>
(() => {
  const SHEETS = window.VH_SHEETS || {};
  const W = 1280, H = 720;
  const LANES = [415, 465, 515];           // feet height of each lane
  const HUNTER_X = 112, HUNTER_Y = 465;
  const ATTACK_X = 232;                    // an enemy that reaches here bites
  const SPAWN_X = W + 60;
  const MAX_HEARTS = 5;
  const SESSION_MS = 20 * 60 * 1000;       // one daily hunt = 20 minutes of play
  const FONT = 'Fredoka, "Trebuchet MS", system-ui, sans-serif';
  const TITLE_FONT = 'Creepster, Impact, fantasy';

  // Enemy types: which sprite, where its feet are in the frame, how tall it stands (at 2x) and how fast it moves.
  // Newer foes come from enemies.js (VH_FOES): sheet keys, feet position and figure height are measured from the art.
  const FOES = window.VH_FOES || {};
  const foe = (id, anim, extra) => FOES[id] && FOES[id][anim]
    ? Object.assign({ sheet: FOES[id][anim].sheet, anim: `${id}-${anim}`, ox: FOES[id][anim].ox, oy: FOES[id][anim].oy, h: FOES[id][anim].fh * (extra.scale || 2) }, extra)
    : null;
  const TYPES = {
    fledgling: { sheet: 'vampWalk',    anim: 'v-walk', ox: 63 / 124, oy: 105 / 124, h: 172, speed: 1 },
    armored:   { sheet: 'armoredWalk', anim: 'a-walk', ox: 65 / 124, oy: 106 / 124, h: 180, speed: 0.72 },
    ghoul:     { sheet: 'ghoulRun',    anim: 'g-run',  ox: 65 / 132, oy: 112 / 132, h: 184, speed: 1.25 },
    bat:       { sheet: 'batFly',      anim: null,     ox: 0.5, oy: 0.5, h: 90, speed: 1.2, flying: true, flap: true },
    // A giant bat that splits into two little letter bats when it is hit.
    bigbat:    { sheet: 'batFly',      anim: null,     ox: 0.5, oy: 0.5, h: 150, speed: 0.85, flying: true, flap: true, scale: 3.2, tint: 0xc9a3ff, split: true, lu: 215 },
    // A see-through ghost that drifts forward in bursts.
    ghost:     FOES.ghost && { sheet: FOES.ghost.img, anim: null, ox: 0.5, oy: 0.5, h: 140, speed: 1.2, flying: true, ghost: true, scale: 2.4, lu: 205 },
    wolf:      foe('wolf', 'run', { speed: 1.45, fps: 14 }),
    mummy:     foe('mummy', 'walk', { speed: 0.6, fps: 7 }),
    // A guard with a shield word in front: type the shield word first, then the vampire's own word.
    shield:    foe('shield', 'walk', { speed: 0.72, fps: 8, shield: true }),
    // Bosses. Each setting has its own, with its own trick. Count Moonfang is the default.
    count:     { sheet: 'countWalk',   anim: 'c-walk', ox: 96 / 176, oy: 150 / 176, h: 246, speed: 0.85, boss: true, name: 'Count Moonfang', cast: 'c-cast', trick: 'knock', flees: 'Moonfang flees!' },
    batqueen:  foe('batqueen', 'walk', { speed: 0.8, fps: 8, boss: true, name: 'Queen Vespera', cast: 'batqueen-cast', trick: 'bats', flees: 'The Bat Queen flies off!' }),
    werewolf:  foe('werewolf', 'walk', { speed: 0.62, fps: 9, boss: true, name: 'Grizzlefang', cast: 'werewolf-cast', trick: 'charge', flees: 'Grizzlefang runs home!' }),
    pharaoh:   foe('pharaoh', 'walk', { speed: 0.6, fps: 7, boss: true, name: 'Pharaoh Mumbles', cast: 'pharaoh-cast', trick: 'minions', extraWords: 2, flees: 'Pharaoh Mumbles unravels!' }),
    ghostknight: foe('ghostknight', 'walk', { speed: 0.8, fps: 8, boss: true, name: 'The Ghost Knight', cast: 'ghostknight-cast', trick: 'blink', alpha: 0.85, flees: 'The Ghost Knight fades away!' }),
    // Brought out by too many wrong keys in one wave: slow, huge, and beaten with whole sentences.
    mutant:    foe('mutant', 'walk', { speed: 0.3, fps: 6, boss: true, mutant: true, scale: 2.3, name: 'Mega Mutant', cast: 'mutant-cast', trick: 'knock', flees: 'The Mutant melts away!' }),
  };
  Object.keys(TYPES).forEach(k => { if (!TYPES[k]) delete TYPES[k]; });
  const BOSS_FOR_SCENE = { cave: 'batqueen', forest: 'werewolf', crypt: 'pharaoh', courtyard: 'ghostknight' };

  // ---------- Wrong keys ----------
  const WRONG_COST = 5;        // points lost for each wrong key
  const JAM_AFTER = 4;         // this many wrong keys in a row jams the crossbow...
  const JAM_MS = 3000;         // ...for 3 seconds
  const MUTANT_AFTER = 15;     // this many wrong keys in one wave brings the Mega Mutant at the end of it
  const SENTENCES = [
    'the bat flew over the moon', 'a ghost ate my homework', 'vampires hate garlic pizza', 'the mummy lost his socks',
    'my crossbow never misses', 'the wolf howls at night', 'count moonfang has bad breath', 'the castle gate is open',

    'garlic bread keeps vampires away', 'the moon is big and bright', 'skeletons love to dance', 'never trust a smiling bat',

  ];

  // ---------- Hunter looks (characters and outfits) ----------
  // Each look has idle, shoot and hurt sheets, where its feet sit in the frame, and where its crossbow tip is (at 2x).
  const LOOKS = Object.assign({
    rook: { idle: 'hunterIdle', shoot: 'hunterShoot', hurt: 'hunterHurt', ox: 71 / 132, oy: 112 / 132, tipX: 74, tipY: -58, shootStart: 3 },

      { id: 'pirate', name: 'Pirate Hunter', price: 450, blurb: 'Yo ho, vampires!' },

      { id: 'fire', name: 'Fire Bolt', price: 300, blurb: 'Leaves a trail of sparks' },

      { id: 'holy', name: 'Holy Water', price: 500, need: 'holy', blurb: 'A splash of blue light' },
      { id: 'sun', name: 'Sunbeam', price: 600, need: 'sun', blurb: 'Pure sunlight' },
    ] },
  };
  const SHOP_TABS = ['hunters', 'outfits', 'bolts'];
  const ITEM = {}; SHOP_TABS.forEach(t => CATALOG[t].items.forEach(it => { it.tab = t; ITEM[it.id] = it; }));
  const BOLT_FX = {
    oak: [0xb48cff, 0xffffff, 0x7a4fd1], silver: [0xcfd8dc, 0xffffff, 0x9aa7b0], fire: [0xff7a2a, 0xffd56b, 0xff4d2a],
    ice: [0x8fd8ff, 0xffffff, 0x5ec8ff], garlic: [0xfff4d6, 0xe8d9a0, 0xffffff], holy: [0x5ec8ff, 0xb8ecff, 0xffffff], sun: [0xffcf5a, 0xfff1c1, 0xffb547],
  };
  function ensureProfile(p) {
    p.coins = p.coins || 0;
    p.owned = p.owned || { rook: true, ivy: true, oak: true };
    p.look = p.look || 'rook';
    p.bolt = p.bolt || 'oak';
    p.ach = Object.assign({ bossKills: 0, bestWpm: 0, bestAcc: 0, capsCleared: {} }, p.ach || {});
    p.announced = p.announced || {};
    return p;
  }

  // ---------- Keyboard layout ----------
  // 0 pinky, 1 ring, 2 middle, 3 pointer
  const FINGER = {
    '1':0,'2':1,'3':2,'4':3,'5':3,'6':3,'7':3,'8':2,'9':1,'0':0,
    q:0,a:0,z:0,p:0,';':0,'/':0,
    w:1,s:1,x:1,o:1,l:1,'.':1,
    e:2,d:2,c:2,i:2,k:2,',':2,
    r:3,f:3,v:3,t:3,g:3,b:3,y:3,h:3,n:3,u:3,j:3,m:3
  };
  const LEFT_HAND = new Set('12345qwertasdfgzxcvb');
  const SHIFTED = { '!':'1','@':'2','#':'3','$':'4','%':'5','^':'6','&':'7','*':'8','(':'9',')':'0','?':'/',':':';','<':',','>':'.' };
  const physKey = c => SHIFTED[c] || c.toLowerCase();
  const needsShift = c => !!SHIFTED[c] || c !== c.toLowerCase();
  const CAPS_BONUS = 1.5;
  const PRACTICE_COLOR = '#5ec8ff', PRACTICE_EDGE = 0x5ec8ff;   // practice mode is always blue so it never looks like the real hunt
  const FINGER_COLORS = [0xff7eb3, 0xffb547, 0x7be08f, 0x5ec8ff];
  const FINGER_NAMES = ['Pinky', 'Ring', 'Middle', 'Pointer'];
  const KB_STEP = 37, KB_KEY = 31, KB_HOME_X = 473.5;
  const KB_ROWS = [
    { chars: '1234567890', y: 572, x0: KB_HOME_X - 27 },
    { chars: 'qwertyuiop', y: 606, x0: KB_HOME_X - 9 },
    { chars: 'asdfghjkl;', y: 640, x0: KB_HOME_X },
    { chars: 'zxcvbnm,./', y: 674, x0: KB_HOME_X + 18 },

  // ---------- Word lists ----------
  const HOME = 'asdfghjkl;';
  const H2 = ['as', 'ad', 'ha', 'la', 'ah', 'sh'];
  const H3 = ['ask', 'add', 'dad', 'sad', 'lad', 'had', 'has', 'gas', 'fad', 'lag', 'sag', 'all', 'ash', 'gal', 'aha'];
  const H4 = ['fall', 'hall', 'lash', 'dash', 'flag', 'glad', 'half', 'sash', 'alas', 'gala', 'dads', 'asks', 'lads', 'fads', 'sass'];
  const H5 = ['flash', 'salad', 'flask', 'glass', 'shall', 'falls', 'halls', 'flags', 'salsa', 'slash'];
  const TOPK = 'qwertyuiop';
  const T2 = ['we', 'it', 'to', 'up', 'or', 'oy'];
  const T3 = ['pet', 'wet', 'yet', 'tie', 'toe', 'rip', 'pot', 'put', 'out', 'our', 'you', 'toy', 'top', 'tip', 'pie', 'rot', 'tow'];
  const T4 = ['type', 'tree', 'pour', 'quit', 'wire', 'ripe', 'rope', 'poet', 'your', 'yeti', 'trip', 'were', 'pity', 'pure'];
  const T5 = ['tower', 'quiet', 'write', 'power', 'route', 'quote', 'equip', 'pretty', 'report', 'pottery', 'territory'];

  const B4 = ['band', 'hand', 'land', 'sand', 'calm', 'cash', 'bash', 'mash', 'slam', 'clam', 'scan', 'jazz', 'lamb', 'balm', 'vans', 'snag'];
  const B5 = ['black', 'snack', 'small', 'flash', 'clash', 'smash', 'blank', 'zebra', 'magic', 'candle', 'fancy', 'vampire'];
  const A3 = ['bat', 'fog', 'owl', 'cat', 'web', 'sun', 'fly', 'run', 'hop', 'zap', 'sky', 'mud', 'jam', 'box', 'fox', 'key', 'map', 'pen', 'cup', 'hat'];
  const A4 = ['moon', 'fang', 'cape', 'bone', 'dark', 'glow', 'howl', 'mist', 'toad', 'wolf', 'tomb', 'crow', 'gate', 'bell', 'rope', 'hunt', 'jump', 'quiz', 'zoom', 'king'];

  const ALPHA = 'abcdefghijklmnopqrstuvwxyz';
  const DIGITS = '1234567890';

  const L = (keys, newKeys, count, speed, gap, tip, extra = {}) => Object.assign({ keys, newKeys, mode: 'letters', count, speed, gap, tip }, extra);
  const Wd = (keys, words, count, speed, gap, tip, extra = {}) => Object.assign({ keys, words, mode: 'words', count, speed, gap, tip }, extra);

  // ---------- Typing modes ----------
  const MODES = {
    home: {
      name: 'Home Row', keysLabel: 'A S D F G H J K L ;',
      waves: [
        L('fj', 'fj', 8, 58, 2600, 'Pointer fingers go on F and J. Feel the little bumps? That is home.'),
        L('fjdk', 'dk', 10, 62, 2400, 'Middle fingers rest on D and K, right next to your pointers.'),
        L('fjdksl', 'sl', 12, 66, 2200, 'Ring fingers rest on S and L. Keep your eyes up here, not on your hands.'),
        L('fjdksla;', 'a;', 12, 70, 2100, 'Pinkies rest on A and ; (the semicolon). Every finger has a home now.'),
        L(HOME, 'gh', 14, 74, 1900, 'Stretch a pointer finger in for G or H, then slide it straight back home.', { boss: ['as', 'ha', 'la', 'dad'] }),
        Wd(HOME, H2, 12, 62, 2600, 'Some vampires carry short words now. Type every letter to load the bolt.', { mode: 'pairs' }),
        Wd(HOME, H3, 12, 56, 3000, 'Three-letter words. If you pick the wrong vampire, press Backspace to let go.'),
        Wd(HOME, H4, 12, 54, 3300, 'Four-letter words. Smooth and steady beats fast and sloppy.', { boss: ['alas', 'flask', 'salad', 'shall', 'glass'] }),
      ],
      endless: { keys: HOME, words: H4.concat(H5), speed: 56, gap: 3200 },
    },
    top: {
      name: 'Top Row', keysLabel: 'Q W E R T Y U I O P',
      waves: [
        L('ru', 'ru', 8, 56, 2700, 'Reach your pointer fingers up from F and J to R and U, then come back home.'),
        L('ruei', 'ei', 10, 60, 2500, 'Middle fingers reach up from D and K to E and I.'),
        L('rueiwo', 'wo', 12, 63, 2300, 'Ring fingers reach up from S and L to W and O.'),
        L('rueiwoqp', 'qp', 12, 66, 2200, 'Pinkies reach up to Q and P. Little fingers, big stretch!'),
        L(TOPK, 'ty', 14, 70, 2000, 'T and Y are a diagonal stretch for your pointers. Always slide back home.', { boss: ['we', 'it', 'to', 'up'] }),
        Wd(TOPK, T2, 12, 60, 2600, 'Short words made of top-row letters.', { mode: 'pairs' }),
        Wd(TOPK, T3, 12, 55, 3000, 'Three-letter words. Keep the other fingers resting on the home row.'),
        Wd(TOPK + HOME, T4.concat(TMIX), 12, 52, 3300, 'Now the top row and home row work together.', { boss: ['tower', 'quiet', 'route', 'ghost', 'shadow'] }),
      ],
      endless: { keys: TOPK + HOME, words: T4.concat(T5, TMIX), speed: 54, gap: 3300 },
    },
    bottom: {
      name: 'Bottom Row', keysLabel: 'Z X C V B N M , . /',
      waves: [
        L('vm', 'vm', 8, 56, 2700, 'Curl your pointer fingers down from F and J to V and M.'),
        L('vmc,', 'c,', 10, 60, 2500, 'Middle fingers curl down from D and K to C and the comma.'),
        L('vmc,x.', 'x.', 12, 63, 2300, 'Ring fingers curl down from S and L to X and the period.'),
        L('vmc,x.z/', 'z/', 12, 66, 2200, 'Pinkies curl down to Z and the slash.'),
        L(BOTK, 'bn', 14, 70, 2000, 'B and N are a stretch inward for your pointers.', { boss: ['an', 'am', 'man', 'van'] }),
        Wd(BOTK + HOME, B2, 12, 60, 2600, 'Short words that mix the bottom row and the home row.', { mode: 'pairs' }),
        Wd(BOTK + HOME, B3, 12, 55, 3000, 'Three-letter words. Feel for F and J between every word.'),
        Wd(BOTK + HOME, B4, 12, 52, 3300, 'Four-letter words. Steady hands!', { boss: ['black', 'snack', 'jazz', 'calm', 'smash'] }),
      ],
      endless: { keys: BOTK + HOME, words: B4.concat(B5), speed: 54, gap: 3300 },
    },
    numbers: {
      name: 'Numbers and Symbols', keysLabel: '1 2 3 4 5 6 7 8 9 0  ! ? @ # $ %',
      waves: [
        L('47', '47', 8, 54, 2800, 'Reach your pointer fingers way up for 4 and 7. Keep your palms still.'),
        L('4738', '38', 10, 57, 2600, 'Middle fingers reach up for 3 and 8.'),
        L('473829', '29', 12, 60, 2400, 'Ring fingers reach up for 2 and 9.'),
        L('47382910', '10', 12, 62, 2300, 'Pinkies reach up for 1 and 0.'),
        L(DIGITS, '56', 14, 64, 2100, '5 and 6 are a long stretch for your pointers.', { boss: ['47', '38', '29', '10'] }),
        { keys: DIGITS, mode: 'gen', genLen: [2, 3], count: 12, speed: 55, gap: 3000, tip: 'Numbers with two or three digits. Read the whole number first.' },
        L(DIGITS + '!?', '!?', 12, 56, 2600, 'Symbols need Shift. Hold Shift with the pinky of the OTHER hand, then press the key.'),
        L(DIGITS + '!?@#$%', '@#$%', 12, 54, 2800, 'More symbols. Same trick: opposite pinky on Shift.', { boss: ['42', '!?', '1990', '$5', '#1'] }),
      ],
      endless: { keys: DIGITS + '!?@#$%', mode: 'gen', genLen: [2, 4], speed: 54, gap: 3200 },
    },
    all: {
      name: 'All Keys', keysLabel: 'Every letter A to Z',
      waves: [
        L(ALPHA, '', 12, 60, 2400, 'Any letter can show up. Find it, press it, and slide back home.'),
        Wd(ALPHA, A3, 12, 56, 2900, 'Three-letter words from the whole keyboard.'),
        Wd(ALPHA, A4, 12, 54, 3200, 'Four-letter words. You are getting good at this.', { boss: ['moon', 'fang', 'ghost', 'night'] }),
        Wd(ALPHA, A5, 12, 52, 3400, 'Five-letter words. Keep a steady rhythm.'),
        Wd(ALPHA, A6, 10, 48, 3800, 'Long spooky words. Take your time and get every letter right.', { boss: ['vampire', 'castle', 'garlic', 'crossbow', 'midnight'] }),
      ],
      endless: { keys: ALPHA, words: A5.concat(A6), speed: 50, gap: 3600 },
    },
  };
  const MODE_ORDER = ['home', 'top', 'bottom', 'numbers', 'all'];

  function waveConfig(modeKey, n) {
    const M = MODES[modeKey];
    if (n <= M.waves.length) return M.waves[n - 1];
    const extra = n - M.waves.length, E = M.endless;
    const pool = E.words || [];
    return {
      keys: E.keys, mode: E.mode || 'words', words: pool, genLen: E.genLen,
      count: 12 + extra * 2, speed: E.speed + extra * 5, gap: Math.max(1800, E.gap - extra * 200),
      boss: extra % 3 === 0 && pool.length ? Phaser.Utils.Array.Shuffle(pool.slice()).slice(0, 5) : null,
      tip: 'The longest night. Every wave from here gets a little faster. How far can you go?',
    };
  }

  // ---------- Saved profiles (this device only) ----------
  const Store = {
    key: 'vh-save-v1',
    data: { profiles: [], lastId: null },
    load() {
      try {
        const d = JSON.parse(localStorage.getItem(this.key) || 'null');
        if (d && Array.isArray(d.profiles)) this.data = d;
      } catch (e) { /* storage blocked: play without saving */ }
    },
    save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {} },
  };
  function todayKey(d = new Date()) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function newProfile(name) {
    return { id: 'p' + Date.now().toString(36), name, created: todayKey(), keyStats: {}, modes: {}, days: {}, sessions: 0 };
  }
  function dayStreak(p) {
    let n = 0; const d = new Date();
    if (!(p.days[todayKey(d)] || {}).done) d.setDate(d.getDate() - 1);   // today not finished yet doesn't break the streak
    while ((p.days[todayKey(d)] || {}).done) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function todayMs(p) { return (p.days[todayKey()] || {}).ms || 0; }
  function fmtMin(ms) { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

  // ---------- Sound (tiny synth, no files needed) ----------
  const Sfx = {
    ctx: null, on: true,
    init() {

        if (this.ctx.state === 'suspended') this.ctx.resume();
        Music.boot(this.ctx);
      } catch (e) { /* no audio, game still works */ }
    },
    tone(freq, dur, type = 'square', vol = 0.08, slideTo = null, delay = 0) {
      if (!this.on || !this.ctx) return;
      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    },
    noise(dur, vol = 0.12, freq = 900) {
      if (!this.on || !this.ctx) return;
      const n = Math.floor(this.ctx.sampleRate * dur);
      const b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(); s.buffer = b;
      const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
      const g = this.ctx.createGain(); g.gain.value = vol;
      s.connect(f).connect(g).connect(this.ctx.destination); s.start();
    },
    shoot() { this.tone(900, 0.12, 'triangle', 0.07, 300); this.noise(0.06, 0.05, 3000); },
    poof()  { this.noise(0.25, 0.14, 700); this.tone(500, 0.18, 'sine', 0.05, 1200); },
    key()   { this.tone(1200, 0.04, 'square', 0.025); },
    click() { this.tone(700, 0.05, 'triangle', 0.05); },
    miss()  { this.tone(140, 0.12, 'square', 0.05, 90); },
    hurt()  { this.tone(220, 0.3, 'sawtooth', 0.07, 80); this.noise(0.2, 0.1, 400); },
    fanfare() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.06, null, i * 0.1)); },
    big()   { [392, 523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.07, null, i * 0.12)); },
    jam()   { this.tone(170, 0.09, 'square', 0.08, 70); this.noise(0.18, 0.16, 320); },
    clunk() { this.tone(120, 0.06, 'square', 0.04, 80); },
    growl() { this.tone(80, 0.7, 'sawtooth', 0.08, 55); this.tone(120, 0.6, 'sawtooth', 0.05, 70, 0.1); this.noise(0.5, 0.1, 250); },
    lose()  { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.06, null, i * 0.16)); },
  };

  // ---------- Music (Suno tracks, published next to the page in music/) ----------
  // Battle music by mode and wave: calm tracks for early home-row waves, the fast ones for later and harder waves.
  const BATTLE_POOLS = {
    home:    ['battle-forest-creep', 'battle-crypt-groove', 'battle-moonlight-waltz', 'battle-courtyard-march'],
    top:     ['battle-crypt-groove', 'battle-moonlight-waltz', 'battle-courtyard-march', 'battle-bat-cave-bounce'],
    bottom:  ['battle-moonlight-waltz', 'battle-crypt-groove', 'battle-bat-cave-bounce', 'battle-courtyard-march'],
    numbers: ['battle-courtyard-march', 'battle-moonlight-waltz', 'battle-bat-cave-bounce', 'battle-rooftop-chase'],
    all:     ['battle-courtyard-march', 'battle-bat-cave-bounce', 'battle-rooftop-chase', 'battle-loop'],
  };
  // Each wave gets a random track (and its matching setting), never the same one twice in a row.
  // Early waves draw from the calm end of the mode's list; the choice widens as the waves go on.
  const pickBattle = (modeKey, wave, prev) => {
    const pool = BATTLE_POOLS[modeKey] || BATTLE_POOLS.all;
    const n = wave > MODES[modeKey].waves.length ? pool.length : Math.min(pool.length, 2 + Math.floor((wave - 1) / 2));
    const c = pool.slice(0, n).filter(t => t !== prev);
    return Phaser.Utils.Array.GetRandom(c.length ? c : pool);
  };
  // Settings, one per battle track. Ground colors and stars come from scenes.js.
  const TRACK_SCENE = {
    'battle-loop': 'graveyard', 'battle-forest-creep': 'forest', 'battle-crypt-groove': 'crypt', 'battle-moonlight-waltz': 'garden',
    'battle-courtyard-march': 'courtyard', 'battle-bat-cave-bounce': 'cave', 'battle-rooftop-chase': 'rooftops',
  };
  const SCENES = Object.assign({
    graveyard: { img: 'graveyard', sky: true, ground: [0x16244a, 0x0b1130], tuft: [0x1c3a3c, 0x23484a, 0x15303a] },
  }, window.VH_SCENES || {});
  const Music = {
    tracks: {
      'title-theme': { loop: true, sec: 31.994 }, 'battle-loop': { loop: true, sec: 27.007 }, 'boss-fight': { loop: true, sec: 106.662 },
      'wave-cleared': { sec: 4.091, vol: 0.16 }, 'reward-unlocked': { sec: 8.6 }, 'session-complete': { sec: 17.2 },
      // battle loops, calm to intense; fetched only when a wave needs one so an iPad never holds them all at once
      'battle-forest-creep': { loop: true, lazy: true, sec: 34.733 }, 'battle-crypt-groove': { loop: true, lazy: true, sec: 124.797 },
      'battle-moonlight-waltz': { loop: true, lazy: true, sec: 54.126 }, 'battle-courtyard-march': { loop: true, lazy: true, sec: 90.678 },
      'battle-bat-cave-bounce': { loop: true, lazy: true, sec: 86.273 }, 'battle-rooftop-chase': { loop: true, lazy: true, sec: 44.8 },
    },
    loading: {}, keep: null,
    ctx: null, out: null, buffers: {}, cur: null, curName: null, wanted: null, on: true,
    vol: 0.18,          // background tracks sit well under the sound effects
    stingVol: 0.3,      // jingles a little above the background, never a jump in loudness
    stingUntil: 0,
    boot(ctx) {
      if (this.ctx) return;
      this.ctx = ctx;
      this.out = ctx.createGain(); this.out.gain.value = this.vol; this.out.connect(ctx.destination);
      Object.keys(this.tracks).forEach(name => { if (!this.tracks[name].lazy) this.load(name); });
      if (this.wanted) this.want(this.wanted);
    },
    load(name) {
      if (!this.ctx || !name || this.buffers[name] || this.loading[name]) return;
      this.loading[name] = true;
      fetch(`music/${name}.mp3`).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then(b => new Promise((ok, bad) => this.ctx.decodeAudioData(b, ok, bad)))
        .then(buf => { this.buffers[name] = buf; if (this.wanted === name && this.curName !== name) this.start(name); })
        .catch(() => { /* music missing: the game still plays with sound effects */ })
        .finally(() => { delete this.loading[name]; });
    },
    prefetch(name) { this.keep = name; this.load(name); },
    want(name) {
      this.wanted = name;
      if (this.curName === name) return;
      if (this.buffers[name]) this.start(name); else this.load(name);
    },
    start(name) {
      const buf = this.buffers[name];
      if (!this.ctx || !buf) return;
      this.stopCurrent();
      if (this.tracks[name].lazy)   // free the battle loops we are done with
        Object.keys(this.buffers).forEach(k => { if (this.tracks[k].lazy && k !== name && k !== this.keep) delete this.buffers[k]; });
      if (!this.on) { this.curName = null; return; }
      const t = this.tracks[name], src = this.ctx.createBufferSource(), g = this.ctx.createGain();
      src.buffer = buf; src.loop = !!t.loop;
      if (t.loop) { src.loopStart = 0; src.loopEnd = Math.min(buf.duration, t.sec); }
      const now = this.ctx.currentTime;
      g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(1, now + 0.6);
      src.connect(g).connect(this.out); src.start();
      this.cur = { src, g }; this.curName = name;
    },
    stopCurrent() {
      if (!this.cur) return;
      const { src, g } = this.cur, now = this.ctx.currentTime;
      try { g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.4); src.stop(now + 0.45); } catch (e) {}
      this.cur = null; this.curName = null;
    },
    sting(name) {   // a one-shot jingle; the background track dips under it
      const buf = this.buffers[name];
      if (!this.ctx || !buf || !this.on) return false;
      const now = this.ctx.currentTime;
      if (now < this.stingUntil) return true;   // one jingle at a time (boss defeat and wave clear can land together)
      const src = this.ctx.createBufferSource(), g = this.ctx.createGain();
      const dur = Math.min(buf.duration, this.tracks[name].sec), fade = Math.min(1.2, dur * 0.3);
      src.buffer = buf;
      const vol = this.tracks[name].vol || this.stingVol;
      g.gain.setValueAtTime(vol, now);
      g.gain.setValueAtTime(vol, now + dur - fade);
      g.gain.linearRampToValueAtTime(0.0001, now + dur);   // ease out instead of stopping dead
      src.connect(g).connect(this.ctx.destination); src.start(now); src.stop(now + dur + 0.05);
      this.stingUntil = now + dur;
      this.out.gain.cancelScheduledValues(now);
      this.out.gain.setValueAtTime(this.vol, now); this.out.gain.linearRampToValueAtTime(this.vol * 0.3, now + 0.2);
      this.out.gain.setValueAtTime(this.vol * 0.3, now + dur - fade); this.out.gain.linearRampToValueAtTime(this.vol, now + dur + 0.4);
      return true;
    },
    toggle() {
      this.on = !this.on;
      if (!this.on) this.stopCurrent(); else if (this.wanted) { this.curName = null; this.want(this.wanted); }
      return this.on;
    },
  };

  // ---------- Small effect textures, drawn in code ----------
  function tex(scene, key, w, h, draw) {

    });

    });

    setHudVisible(v) {
      [this.waveText, this.statsText, this.scoreText, this.streakText, this.sessionText, this.jamLabel, this.jamGfx, this.jamNote, ...this.heartIcons].forEach(o => o.setVisible(v));
      [this.sessionBar, this.coinIcon, this.coinText, this.mutLabel, this.mutGfx].forEach(o => o.setVisible(v && !this.practice));   // practice earns nothing, so no coins or hunt bar
      if (!v) { this.jamText.setVisible(false); this.jamBar.clear(); }
    }
    drawMeters() {
      const g = this.jamGfx; g.clear();
      const jammed = this.jamLeft > 0;
      for (let i = 0; i < JAM_AFTER; i++) {
        const x = 104 + i * 22, on = jammed || i < this.wrongRun;
        g.fillStyle(on ? 0xff5a5a : 0x2c2148, 1); g.fillCircle(x, 140, 7);
        g.lineStyle(2, on ? 0xffb0b0 : 0x4a3a70, 1); g.strokeCircle(x, 140, 7);
      }
      this.jamLabel.setColor(jammed ? '#ff7b7b' : '#e4d9fb');
      this.jamNote.setText(jammed ? `JAMMED  ${(this.jamLeft / 1000).toFixed(1)}s` : this.practice ? 'Practice: no jams' : `${JAM_AFTER} misses in a row jam it`)
        .setColor(jammed ? '#ff7b7b' : '#9a8bc2');
      if (this.practice) return;
      const m = this.mutGfx; m.clear();
      const f = Math.min(1, this.waveWrong / MUTANT_AFTER);
      m.fillStyle(0x2c2148, 1); m.fillRoundedRect(20, 180, 200, 8, 4);
      if (f > 0) { m.fillStyle(this.mutantDue ? 0x9be15d : f > 0.66 ? 0xff5a5a : f > 0.33 ? 0xffb547 : 0xffcf5a, 1); m.fillRoundedRect(20, 180, Math.max(8, 200 * f), 8, 4); }
      this.mutLabel.setText(this.mutantDue ? (this.mutantSpawned ? 'Beat the Mega Mutant!' : 'Mega Mutant is coming!') : `Wrong keys this wave  ${this.waveWrong} / ${MUTANT_AFTER}`)
        .setColor(this.mutantDue ? '#9be15d' : f > 0.66 ? '#ff9b9b' : '#e4d9fb');
    }
    updateHearts() {
      this.heartIcons.forEach((h, i) => h.setTexture(i < this.hearts ? 'heart' : 'heartEmpty'));
    }
    mult() { return 1 + Math.min(3, Math.floor(this.streak / 10)); }
    accuracy() { const t = this.correct + this.wrong; return t ? Math.round(this.correct / t * 100) : 100; }
    wpm() { return this.activeMs > 4000 ? Math.round((this.correct / 5) / (this.activeMs / 60000)) : 0; }
    updateHud() {
      this.drawMeters();
      this.waveText.setText(`${this.practice ? 'Practice  ·  ' : ''}${MODES[this.modeKey].name}  ·  Wave ${this.wave}`);
      this.statsText.setText(`Accuracy ${this.accuracy()}%   ·   Speed ${this.wpm()} WPM   ·   Pace ${this.pace.toFixed(1)}×${this.caps && !this.practice ? '   ·   Capitals ×1.5' : ''}`);
      if (this.practice) {
        this.scoreText.setText('PRACTICE').setColor(PRACTICE_COLOR);
        this.streakText.setText(this.streak ? `Streak ${this.streak}` : '');
        this.sessionText.setText('Practice: no points or coins').setColor(PRACTICE_COLOR);
        return;
      }
      this.scoreText.setText(this.score.toLocaleString()).setColor('#f4ecff');
      this.sessionText.setColor('#e4d9fb');
      const m = this.mult();
      this.streakText.setText(this.streak ? `Streak ${this.streak}${m > 1 ? '   ×' + m : ''}` : '');
      this.drawSession();
      this.coinText.setText(`${this.profile.coins.toLocaleString()}`);
    }
    drawSession() {
      const p = this.profile; if (!p) return;
      const ms = todayMs(p), done = (p.days[todayKey()] || {}).done;
      this.sessionText.setText(done ? `Daily hunt done!  ${fmtMin(ms)} today` : `Daily hunt  ${fmtMin(ms)} / 20:00`);
      const g = this.sessionBar; g.clear();
      g.fillStyle(0x2c2148, 1); g.fillRoundedRect(20, 80, 200, 8, 4);
      g.fillStyle(done ? 0x7be08f : 0xffcf5a, 1); g.fillRoundedRect(20, 80, Math.max(8, 200 * Math.min(1, ms / SESSION_MS)), 8, 4);
    }

    // ---------- On-screen keyboard ----------
    buildKeyboard() {
      this.keyPos = {}; this.keyGfx = {}; this.keyTxt = {};
      this.kbObjs = [];
      const K = o => { this.kbObjs.push(o); return o; };
      KB_ROWS.forEach(row => {
        [...row.chars].forEach((ch, i) => {
          const x = row.x0 + i * KB_STEP, y = row.y;
          this.keyPos[ch] = { x, y };
          this.keyGfx[ch] = K(this.add.graphics().setDepth(2001));
          this.keyTxt[ch] = K(this.txt(x, y - 1, ch.toUpperCase(), { fontSize: '16px', fontStyle: '600' }).setOrigin(0.5).setDepth(2003));
        });
      });
      const bottom = KB_ROWS[3];
      this.shiftPos = {
        left:  { x: bottom.x0 - KB_STEP / 2 - 36, y: bottom.y },
        right: { x: bottom.x0 + 9 * KB_STEP + KB_STEP / 2 + 36, y: bottom.y },
      };
      this.shiftGfx = K(this.add.graphics().setDepth(2001));
      this.shiftTxt = ['left', 'right'].map(s => K(this.txt(this.shiftPos[s].x, this.shiftPos[s].y, 'SHIFT', { fontSize: '11px', fontStyle: '600' }).setOrigin(0.5).setDepth(2003)));
      this.spaceGfx = K(this.add.graphics().setDepth(2001));
      this.spaceTxt = K(this.txt(640, 703, 'SPACE', { fontSize: '11px', fontStyle: '600' }).setOrigin(0.5).setDepth(2003));
      this.keyGlow = this.add.image(0, 0, 'keyglow').setTint(0xffcf5a).setDepth(2002).setVisible(false);
      this.shiftGlow = this.add.image(0, 0, 'shiftglow').setTint(0xffcf5a).setDepth(2002).setVisible(false);
      this.tweens.add({ targets: [this.keyGlow, this.shiftGlow], alpha: { from: 1, to: 0.4 }, duration: 420, yoyo: true, repeat: -1 });
      this.nextKey = null;

      K(this.txt(36, 570, 'FINGER COLORS', { fontSize: '13px', fontStyle: '600', color: '#9a8bc2' }).setLetterSpacing(1.5).setDepth(2003));
      FINGER_NAMES.forEach((name, i) => {
        const y = 602 + i * 26;
        const g = K(this.add.graphics().setDepth(2003));
        g.fillStyle(FINGER_COLORS[i], 1); g.fillCircle(46, y, 7);
        K(this.txt(62, y, name, { fontSize: '16px', fontStyle: '500' }).setOrigin(0, 0.5).setDepth(2003));
      });
      K(this.txt(160, 602, 'Same color,\nsame finger\non both hands.', { fontSize: '14px', fontStyle: '500', color: '#9a8bc2', lineSpacing: 4 })
        .setOrigin(0, 0.15).setDepth(2003));

      // The cover that sits over the keyboard everywhere except practice mode, so eyes stay on the screen.
      const cg = this.add.graphics().setDepth(2001);
      cg.fillStyle(0x140c28, 1); cg.fillRoundedRect(24, 562, 902, 148, 16);
      cg.lineStyle(2, 0x3d2b63, 1); cg.strokeRoundedRect(24, 562, 902, 148, 16);
      this.kbCover = [cg,
        this.txt(475, 592, 'Eyes on the vampires!', { fontFamily: TITLE_FONT, fontSize: '32px', color: '#ffcf5a', stroke: '#3b1a5a', strokeThickness: 5 }).setOrigin(0.5).setDepth(2003),
        this.txt(475, 632, 'The keyboard is covered so your fingers learn where the keys are.\nRest on the home row and feel for the little bumps on F and J.',
          { fontSize: '17px', fontStyle: '500', color: '#e4d9fb', align: 'center', lineSpacing: 4 }).setOrigin(0.5, 0.25).setDepth(2003),
        this.txt(475, 690, 'Need to see the keys? Press P on the hunt menu for Practice mode (it does not earn points or coins).',
          { fontSize: '14px', fontStyle: '600', color: '#5ec8ff' }).setOrigin(0.5).setDepth(2003),
      ];
      this.kbShown = true;

      this.txt(950, 570, 'TIP', { fontSize: '13px', fontStyle: '600', color: '#9a8bc2' }).setLetterSpacing(1.5).setDepth(2003);
      this.tipText = this.txt(950, 594, '', { fontSize: '16px', fontStyle: '500', color: '#e4d9fb', lineSpacing: 4, wordWrap: { width: 300 } })
        .setDepth(2003);

      this.refreshKeyboard(HOME, '');
      this.drawShift(false);
      this.drawSpace(true);
      this.showKeyboard(false);
    }
    // The on-screen keyboard is only shown in practice mode. Everywhere else it is covered up.
    showKeyboard(on) {
      this.kbShown = on;
      this.kbObjs.forEach(o => o.setVisible(on));
      this.kbCover.forEach(o => o.setVisible(!on));
      if (!on) this.hideGlow();
    }
    drawKey(ch, state) {
      const { x, y } = this.keyPos[ch], g = this.keyGfx[ch], s = KB_KEY;
      const col = FINGER_COLORS[FINGER[ch]];
      g.clear();
      if (state === 'off') {
        g.fillStyle(0x1d1533, 1); g.fillRoundedRect(x - s / 2, y - s / 2, s, s, 6);
        g.lineStyle(2, 0x2c2148, 1); g.strokeRoundedRect(x - s / 2, y - s / 2, s, s, 6);
        this.keyTxt[ch].setColor('#5b4f78');
      } else {
        g.fillStyle(col, state === 'new' ? 0.55 : 0.25); g.fillRoundedRect(x - s / 2, y - s / 2, s, s, 6);
        g.lineStyle(2, col, 1); g.strokeRoundedRect(x - s / 2, y - s / 2, s, s, 6);
        this.keyTxt[ch].setColor('#ffffff');
      }
      if (ch === 'f' || ch === 'j') {
        g.fillStyle(state === 'off' ? 0x5b4f78 : 0xffffff, 1); g.fillRoundedRect(x - 5, y + 9, 10, 3, 1.5);
      }
    }
    refreshKeyboard(keys, newKeys = '') {
      const on = new Set([...keys].map(physKey)), fresh = new Set([...newKeys].map(physKey));
      Object.keys(this.keyPos).forEach(ch => this.drawKey(ch, fresh.has(ch) ? 'new' : on.has(ch) ? 'on' : 'off'));
      this.drawShift([...keys].some(c => SHIFTED[c]));
    }
    drawShift(lit) {
      const g = this.shiftGfx; g.clear();
      Object.values(this.shiftPos).forEach(({ x, y }) => {
        g.fillStyle(lit ? 0xff7eb3 : 0x1d1533, lit ? 0.25 : 1); g.fillRoundedRect(x - 32, y - KB_KEY / 2, 64, KB_KEY, 6);
        g.lineStyle(2, lit ? 0xff7eb3 : 0x2c2148, 1); g.strokeRoundedRect(x - 32, y - KB_KEY / 2, 64, KB_KEY, 6);
      });
      this.shiftTxt.forEach(t => t.setColor(lit ? '#ffffff' : '#5b4f78'));
    }
    drawSpace(lit) {
      const g = this.spaceGfx; g.clear();
      g.fillStyle(lit ? 0xffcf5a : 0x1d1533, lit ? 0.3 : 1); g.fillRoundedRect(525, 694, 230, 18, 6);
      g.lineStyle(2, lit ? 0xffcf5a : 0x2c2148, 1); g.strokeRoundedRect(525, 694, 230, 18, 6);
      this.spaceTxt.setColor(lit ? '#ffffff' : '#5b4f78');
    }
    flashKey(ch, ok) {
      const p = this.keyPos[physKey(ch)]; if (!p || !this.kbShown) return;
      const g = this.add.graphics().setDepth(2002);
      g.fillStyle(ok ? 0x7be08f : 0xff5a5a, 0.7); g.fillRoundedRect(p.x - KB_KEY / 2, p.y - KB_KEY / 2, KB_KEY, KB_KEY, 6);
      this.tweens.add({ targets: g, alpha: 0, duration: 260, onComplete: () => g.destroy() });
    }
    updateNextKey() {
      let c = null;
      if (this.state === 'playing' && this.kbShown) {
        if (this.target && !this.target.dead) c = this.target.word[this.target.typed];
        else {
          const alive = this.vamps.filter(v => !v.dead);
          if (alive.length) c = alive.reduce((a, b) => (a.x < b.x ? a : b)).word[0];
        }
      }
      if (c === this.nextKey) return;
      this.nextKey = c;
      const k = c && physKey(c);
      if (k && this.keyPos[k]) this.keyGlow.setPosition(this.keyPos[k].x, this.keyPos[k].y).setVisible(true);
      else this.keyGlow.setVisible(false);
      if (c && needsShift(c)) {
        const side = LEFT_HAND.has(k) ? 'right' : 'left';   // Shift with the opposite hand
        this.shiftGlow.setPosition(this.shiftPos[side].x, this.shiftPos[side].y).setVisible(true);
      } else this.shiftGlow.setVisible(false);
    }
    hideGlow() { this.keyGlow.setVisible(false); this.shiftGlow.setVisible(false); this.nextKey = null; }

    // ---------- Panels ----------
    showPanel({ title, body, footer, h = 300, y = 300, w = 740 }) {
      this.hidePanel();

        .setOrigin(0.5).setDepth(2900).setScale(0.6).setAlpha(0);
      this.tweens.add({ targets: t, scale: 1, alpha: 1, duration: 300, ease: 'Back.out',

        .setOrigin(0.5).setDepth(2900);
      const t = this.txt(640, 113, 'THE VAMPIRE HUNTER', { fontFamily: TITLE_FONT, fontSize: '26px', color: '#ff8fb0', stroke: '#3b1a5a', strokeThickness: 6 })
        .setOrigin(0.5).setDepth(2900);
      this.menu.push(t);
      const s = this.txt(640, 146, sub, { fontSize: '24px', fontStyle: '600', color: '#e4d9fb', stroke: '#140c28', strokeThickness: 4 })
        .setOrigin(0.5).setDepth(2900);

    }
    card(x, y, w, h, onPick, hot = false, edge = null) {
      const g = this.add.graphics().setDepth(2950);
      g.fillStyle(0x000000, 0.3); g.fillRoundedRect(x - w / 2 + 5, y - h / 2 + 8, w, h, 18);
      g.fillStyle(0x140c28, 0.95); g.fillRoundedRect(x - w / 2, y - h / 2, w, h, 18);

    showModes() {

      this.tipText.setText(pr

        : done
          ? `You finished today's 20-minute hunt. Extra practice still makes you faster!`
          : `Today's hunt: ${fmtMin(ms)} of 20:00. Any mode counts toward your daily hunt.`);
      MODE_ORDER.forEach((key, i) => {

        const y = 196 + i * 70, x = 520;

        this.menu.push(
          this.txt(x - 300, y, `${i + 1}`, { fontSize: '20px', fontStyle: '700', color: '#140c28', backgroundColor: pr ? PRACTICE_COLOR : '#ffcf5a', padding: { x: 9, y: 2 } }).setOrigin(0, 0.5).setDepth(2970),
          this.txt(x - 258, y - 11, M.name, { fontSize: '22px', fontStyle: '700' }).setOrigin(0, 0.5).setDepth(2970),
          this.txt(x - 258, y + 13, M.keysLabel, { fontSize: '14px', fontStyle: '500', color: '#cbbcec' }).setOrigin(0, 0.5).setDepth(2970),
          pr
            ? this.txt(x + 300, y, 'Practice\nkeyboard on', { fontSize: '15px', fontStyle: '600', color: PRACTICE_COLOR, align: 'right' }).setOrigin(1, 0.5).setDepth(2970)
            : this.txt(x + 300, y, prog.bestWave ? `Best: wave ${prog.bestWave}\n${(prog.bestScore || 0).toLocaleString()} points` : 'Not tried yet',

      });

      this.card(px, py, 330, 52, () => this.togglePractice(), false, PRACTICE_EDGE);
      this.menu.push(
        this.txt(px - 150, py, 'P', { fontSize: '20px', fontStyle: '700', color: '#140c28', backgroundColor: PRACTICE_COLOR, padding: { x: 9, y: 2 } }).setOrigin(0, 0.5).setDepth(2970),
        this.txt(px - 112, py - 10, pr ? 'Back to the real hunt' : 'Practice mode', { fontSize: '19px', fontStyle: '700', color: PRACTICE_COLOR }).setOrigin(0, 0.5).setDepth(2970),
        this.txt(px - 112, py + 12, pr ? 'Keyboard hidden · earn points and coins' : 'Keyboard shown · no points or coins', { fontSize: '13px', fontStyle: '500', color: '#cbbcec' }).setOrigin(0, 0.5).setDepth(2970));
      const bx = 1020, by = 318;

        this.txt(x - 112, y - 10, `Capitals: ${on ? 'ON' : 'OFF'}`, { fontSize: '19px', fontStyle: '700', color: on ? '#7be08f' : '#ffffff' }).setOrigin(0, 0.5).setDepth(2970),
