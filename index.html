    }
    toggleCaps() {
      this.profile.caps = !this.profile.caps; Store.save();
      Sfx.click();
      this.showModes();
    }
    // ---------- Shop ----------
    itemState(it) {
      const p = this.profile;
      const equipped = it.tab === 'bolts' ? p.bolt === it.id : p.look === it.id;
      if (equipped) return 'equipped';
      if (p.owned[it.id]) return 'owned';
      if (it.need && !NEEDS[it.need].ok(p)) return 'locked';
      if (it.ultimate) return 'owned';   // earned, not bought
      return 'forsale';
    }
    showShop(tab = this.shopTab || 'hunters', msg = '') {
      this.menuPrep();
      this.state = 'shop';
      if (tab !== this.shopTab) this.shopSel = 0;
      this.shopTab = tab;
      const p = this.profile, items = CATALOG[tab].items;
      this.shopSel = Phaser.Math.Clamp(this.shopSel || 0, 0, items.length - 1);
      this.refreshKeyboard('123', '');
      this.drawSpace(false);
      this.tipText.setText('Earn coins by stopping vampires, clearing waves, beating bosses and finishing your daily hunt.');
      this.menu.push(
        this.txt(640, 58, 'HUNTER SHOP', { fontFamily: TITLE_FONT, fontSize: '72px', color: '#ffcf5a', stroke: '#3b1a5a', strokeThickness: 9 }).setOrigin(0.5).setDepth(2900),
        this.add.image(588, 114, 'coin').setScale(1.3).setDepth(2900),
        this.txt(606, 114, `${p.coins.toLocaleString()} coins`, { fontSize: '24px', fontStyle: '700', color: '#ffcf5a', stroke: '#140c28', strokeThickness: 4 }).setOrigin(0, 0.5).setDepth(2900));
      SHOP_TABS.forEach((t, i) => {
        const x = 640 + (i - 1) * 190, y = 160, on = t === tab;
        this.card(x, y, 170, 42, () => this.showShop(t), on);
        this.menu.push(this.txt(x, y, `${i + 1}  ${CATALOG[t].title}`, { fontSize: '19px', fontStyle: '700', color: on ? '#ffcf5a' : '#ffffff' }).setOrigin(0.5).setDepth(2970));
      });
      const cols = 3, cw = 340, ch = 104, gx = 16, gy = 12;
      const rows = Math.ceil(items.length / cols);
      const y0 = 236 + (3 - rows) * (ch + gy) / 2;
      items.forEach((it, i) => {
        const col = i % cols, row = Math.floor(i / cols);
        const x = 640 + (col - 1) * (cw + gx), y = y0 + row * (ch + gy);
        const st = this.itemState(it), sel = i === this.shopSel;
        this.card(x, y, cw, ch, () => { if (this.shopSel === i) this.shopAct(it); else { this.shopSel = i; this.showShop(tab); } }, sel);
        // preview
        if (tab === 'bolts') {
          const key = this.textures.exists('bolt-' + it.id) ? 'bolt-' + it.id : 'bolt';
          const img = this.add.image(x - 112, y, key).setScale(key === 'bolt' ? 1.2 : 1.3).setDepth(2970);
          if (st === 'locked') img.setTint(0x3a2a55);
          this.menu.push(img);
        } else {
          const spr = this.lookSprite(it.id, x - 112, y + 44, 0.95, 2970, i);
          if (st === 'locked') spr.setTintFill(0x3a2a55);
          this.menu.push(spr);
        }
        let status, color = '#cbbcec';
        if (st === 'equipped') { status = 'Equipped'; color = '#7be08f'; }
        else if (st === 'owned') { status = it.ultimate ? 'Earned! Press ENTER to wear' : 'Owned · ENTER to wear'; color = '#e4d9fb'; }
        else if (st === 'locked') { status = `Locked: ${NEEDS[it.need].text} (${NEEDS[it.need].prog(p)})`; color = '#ffb547'; }
        else { status = `${it.price} coins`; color = p.coins >= it.price ? '#ffcf5a' : '#ff9b9b'; }
        this.menu.push(
          this.txt(x - 50, y - 26, it.name + (it.ultimate ? '  ★' : ''), { fontSize: '19px', fontStyle: '700', color: it.ultimate ? '#ffcf5a' : '#ffffff' }).setOrigin(0, 0.5).setDepth(2970),
          this.txt(x - 50, y - 3, it.blurb, { fontSize: '13px', fontStyle: '500', color: '#9a8bc2' }).setOrigin(0, 0.5).setDepth(2970),
          this.txt(x - 50, y + 26, status, { fontSize: '14px', fontStyle: '700', color, wordWrap: { width: 210 } }).setOrigin(0, 0.5).setDepth(2970));
      });
      this.menu.push(
        this.txt(640, 512, msg, { fontSize: '19px', fontStyle: '700', color: '#ffcf5a', stroke: '#140c28', strokeThickness: 4 }).setOrigin(0.5).setDepth(2970),
        this.txt(640, 538, '1 to 3 tabs   ·   arrow keys choose   ·   ENTER buy or wear   ·   ESC back', { fontSize: '16px', fontStyle: '600', color: '#e4d9fb', stroke: '#140c28', strokeThickness: 4 }).setOrigin(0.5).setDepth(2970));
    }
    shopMove(dx, dy) {
      const n = CATALOG[this.shopTab].items.length;
      let i = this.shopSel + dx + dy * 3;
      if (i < 0 || i >= n) return;
      this.shopSel = i; Sfx.key(); this.showShop(this.shopTab);
    }
    shopAct(it) {
      const p = this.profile, st = this.itemState(it);
      let msg = '';
      if (st === 'equipped') msg = `You are already using ${it.name}.`;
      else if (st === 'owned') {
        p.owned[it.id] = true;
        if (it.tab === 'bolts') p.bolt = it.id; else p.look = it.id;
        Sfx.click(); msg = `Now using ${it.name}!`;
      } else if (st === 'locked') { Sfx.miss(); msg = `Locked. ${NEEDS[it.need].text} to unlock it.`; }
      else if (p.coins >= it.price) {
        p.coins -= it.price; p.owned[it.id] = true;
        if (it.tab === 'bolts') p.bolt = it.id; else p.look = it.id;
        if (!Music.sting('reward-unlocked')) Sfx.big();
        msg = `You got ${it.name}!`;
      } else { Sfx.miss(); msg = `You need ${(it.price - p.coins).toLocaleString()} more coins for ${it.name}.`; }
      Store.save();
      this.showShop(this.shopTab, msg);
    }

    // ---------- Coins and achievements ----------
    addCoins(n) {
      if (this.practice) return 0;
      const c = Math.round(n * (this.caps ? CAPS_BONUS : 1));
      this.profile.coins += c; this.coinsEarned += c;
      return c;
    }
    checkUnlocks() {
      if (this.practice) return;
      const p = this.profile;
      Object.values(ITEM).forEach(it => {
        if (!it.need || p.announced[it.id] || !NEEDS[it.need].ok(p)) return;
        p.announced[it.id] = true;
        if (it.ultimate) p.owned[it.id] = true;
        this.time.delayedCall(400, () => {
          this.banner(it.ultimate ? `${it.name} earned!` : `${it.name} unlocked!`, 260);
          if (!Music.sting('reward-unlocked')) Sfx.big();
        });
      });
      Store.save();
    }

    pickMode(key) {
      Sfx.click();
      Store.data.lastMode = key; Store.save();
      this.startGame(key);
    }

    // ---------- Learning: per-key stats for this hunter ----------
    keyStat(k) {
      if (this.practice) return { hit: 0, miss: 0, ms: 0 };   // practice with the keyboard showing doesn't change a hunter's key stats
      const ks = this.profile.keyStats; return ks[k] || (ks[k] = { hit: 0, miss: 0, ms: 0 });
    }
    keyWeight(k) {
      const s = this.profile && this.profile.keyStats[k];
      if (!s || s.hit + s.miss < 3) return 1.6;                 // new keys get extra practice
      const missRate = s.miss / (s.hit + s.miss + 2);
      const avg = s.hit ? s.ms / s.hit : 1500;
      const slow = Phaser.Math.Clamp((avg - 500) / 1500, 0, 1);
      return 1 + missRate * 5 + slow * 1.5;
    }
    weakKeys(n) {
      if (!this.profile) return [];
      return Object.entries(this.profile.keyStats)
        .filter(([, s]) => s.hit + s.miss >= 5)
        .map(([k]) => [k, this.keyWeight(k)])
        .filter(([, w]) => w > 1.5)
        .sort((a, b) => b[1] - a[1]).slice(0, n).map(([k]) => k);
    }
    weighted(items, wf) {
      const ws = items.map(wf), total = ws.reduce((a, b) => a + b, 0);
      let r = Math.random() * total;
      for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
      return items[items.length - 1];
    }

    // ---------- Flow ----------
    startGame(modeKey, wave = 1) {
      this.menuPrep();
      this.showKeyboard(!!this.practice);
      this.hunter.setVisible(true); this.shadowH.setVisible(true);
      this.setLook(this.profile.look);
      this.battleMusic = this.nextMusic = null;
      const prog = this.profile.modes[modeKey] || {};
      Object.assign(this, {
        modeKey, wave, startWave: wave, hearts: MAX_HEARTS, score: 0, streak: 0, bestStreak: 0,
        correct: 0, wrong: 0, kills: 0, activeMs: 0, missed: {}, target: null, clearing: false,
        pace: Phaser.Math.Clamp(prog.pace || 0.9, 0.75, 1.5), lastKeyAt: 0, sessionCheered: false, saveClock: 0,
        caps: !!this.profile.caps, coinsEarned: 0,
        wrongRun: 0, waveWrong: 0, jamLeft: 0, pointsLost: 0, mutantDue: false, mutantSpawned: false, mutants: 0,
      });
      this.updateHearts();
      this.setHudVisible(true);
      this.introWave(null);
    }

    introWave(clearedNote) {
      this.state = 'intermission';
      this.cfg = waveConfig(this.modeKey, this.wave);
      const cfg = this.cfg;
      this.refreshKeyboard(cfg.keys, cfg.newKeys || '');
      const capsHere = this.caps && /[a-z]/.test(cfg.keys);
      if (capsHere) this.drawShift(true);
      this.tipText.setText(cfg.tip);
      this.hideGlow();
      this.drawSpace(true);
      this.updateHud();
      const first = !clearedNote && this.wave === this.startWave;
      let what;
      if (cfg.newKeys) {
        const ks = [...cfg.newKeys];
        const finger = FINGER_NAMES[FINGER[physKey(ks[0])]].toLowerCase();
        what = `New keys: ${ks.map(k => k.toUpperCase()).join('  ')}  (${SHIFTED[ks[0]] ? 'Shift + ' : ''}${finger} fingers)`;
      } else if (cfg.mode === 'pairs') what = 'New: some vampires carry two-letter words.';
      else if (cfg.mode === 'gen') what = 'Vampires carry numbers now.';
      else if (cfg.mode === 'letters') what = 'Letters from all over the keyboard.';
      else if (this.wave <= MODES[this.modeKey].waves.length) what = `Vampires carry ${cfg.words[0].length}-letter words now.`;
      else what = 'Endless night: they keep getting faster.';
      const rulesLine = first && !this.practice
        ? `\n\nCareful aim! Each wrong key costs ${WRONG_COST} points. ${JAM_AFTER} in a row jam your crossbow for ${JAM_MS / 1000} seconds. ${MUTANT_AFTER} in one wave bring the Mega Mutant!` : '';
      const bossLine = rulesLine + (cfg.boss ? '\nWatch out: a boss shows up at the end! Type all of its words to chase it off.' : '') +
        (capsHere && first ? `\nCapitals are on: hold Shift with your other hand for capital letters.${this.practice ? '' : ' Points ×1.5!'}` : '');
      const practiceLine = this.practice && first ? 'Practice mode: the keyboard is showing, and nothing here counts for points or coins.\n\n' : '';
      const sessionLine = this.sessionCheered === 'pending' ? this.sessionCheer() : '';
      this.showPanel({
        y: 300, h: (clearedNote ? 330 : 290) + (cfg.boss ? 60 : 0) + (rulesLine ? 120 : 0) + (sessionLine ? 60 : 0) + (capsHere && first ? 60 : 0) + (practiceLine ? 90 : 0),
        title: (this.practice ? 'Practice: ' : '') + (clearedNote ? `Wave ${this.wave - 1} cleared!` : `Wave ${this.wave}`),
        body: practiceLine + sessionLine + (clearedNote ? clearedNote + '\n\n' : '') + (clearedNote ? `Next up, wave ${this.wave}. ` : '') + what + '\n' + cfg.tip + bossLine,
        footer: first ? 'SPACE to start   ·   ESC for menu   ·   Grown-ups: ← → change wave' : 'Press SPACE when you are ready   ·   ESC for menu',
      });
    }
    sessionCheer() {
      this.sessionCheered = true;
      return `Daily hunt complete! That is ${this.profile.sessions} so far. +100 coins!\n\n`;
    }

    beginWave() {
      this.hidePanel();
      this.drawSpace(false);
      this.state = 'playing';
      this.spawned = 0;
      this.bossSpawned = false;
      Object.assign(this, { wrongRun: 0, waveWrong: 0, waveLost: 0, mutantDue: false, mutantSpawned: false });
      this.unjam(true);
      this.battleMusic = this.nextMusic || pickBattle(this.modeKey, this.wave, this.battleMusic);
      this.nextMusic = pickBattle(this.modeKey, this.wave + 1, this.battleMusic);
      Music.want(this.battleMusic);
      Music.prefetch(this.nextMusic);
      const moving = this.sceneTransition(TRACK_SCENE[this.battleMusic]);
      this.spawnClock = moving ? 1900 : 500;   // nobody spawns until the hunter has landed
      this.time.delayedCall(moving ? 1000 : 0, () => this.banner('Wave ' + this.wave));
    }

    waveCleared() {
      if (this.state !== 'playing') return;
      this.unjam(true);
      if (!Music.sting('wave-cleared')) Sfx.fanfare();
      const healed = this.hearts < MAX_HEARTS;
      if (healed) { this.hearts++; this.updateHearts(); }
      let coins = 0;
      if (!this.practice) {
        const prog = this.profile.modes[this.modeKey] || (this.profile.modes[this.modeKey] = {});
        prog.bestWave = Math.max(prog.bestWave || 0, this.wave);
        prog.pace = this.pace;
        coins = this.addCoins(10);
        if (this.caps && this.wave >= MODES[this.modeKey].waves.length) this.profile.ach.capsCleared[this.modeKey] = true;
        this.checkUnlocks();
        this.saveProfile();
      }
      this.wave++;
      const missNote = this.practice ? '' : this.waveWrong === 0 ? '\nNo wrong keys at all. Perfect aim!' : `\nWrong keys this wave: ${this.waveWrong} (-${this.waveLost} points)`;
      Object.assign(this, { wrongRun: 0, waveWrong: 0, waveLost: 0, mutantDue: false, mutantSpawned: false });   // fresh meters for the next wave
      this.introWave((healed ? 'You found a garlic snack: +1 heart!' : 'Not a scratch on you. Nice hunting!') + (this.practice ? '' : `   +${coins} coins`) + missNote);
    }

    pause() {
      if (this.state !== 'playing') return;
      this.state = 'paused';
      this.tweens.pauseAll(); this.time.paused = true;
      this.showPanel({ y: 300, h: 230, title: 'Paused', body: 'Take a breath and put your fingers back on the home row.', footer: 'SPACE to keep hunting   ·   ESC for menu' });
    }
    resume() {
      this.hidePanel();
      this.tweens.resumeAll(); this.time.paused = false;
      this.state = 'playing';
    }
    quitToModes() {
      this.tweens.resumeAll(); this.time.paused = false;
      this.recordGame();
      this.showModes();
    }

    recordGame() {
      if (this.practice) return;   // practice never touches best scores, achievements or saved pace
      const prog = this.profile.modes[this.modeKey] || (this.profile.modes[this.modeKey] = {});
      prog.bestScore = Math.max(prog.bestScore || 0, this.score);
      const a = this.profile.ach;
      if (this.correct >= 40) a.bestWpm = Math.max(a.bestWpm, this.wpm());
      if (this.correct + this.wrong >= 60) a.bestAcc = Math.max(a.bestAcc, this.accuracy());
      this.checkUnlocks();
      prog.pace = Phaser.Math.Clamp(this.pace * 0.95, 0.75, 1.5);   // next game starts a touch easier than this one ended
      this.saveProfile();
    }
    saveProfile() { if (this.profile) Store.save(); }

    addPlayTime(ms) {
      if (this.practice) return;   // practice doesn't count toward the daily hunt
      const p = this.profile, k = todayKey();
      const day = p.days[k] || (p.days[k] = { ms: 0, done: false });
      day.ms += ms;
      if (!day.done && day.ms >= SESSION_MS) {
        day.done = true; p.sessions = (p.sessions || 0) + 1;
        this.addCoins(100);
        this.sessionCheered = 'pending';
        if (!Music.sting('session-complete')) Sfx.big();
        this.banner('Daily hunt complete!', 150);
        this.saveProfile();
      }
      this.saveClock += ms;
      if (this.saveClock > 5000) { this.saveClock = 0; this.saveProfile(); }
    }

    gameOver() {
      this.state = 'over';
      this.unjam(true);
      this.overReady = false;
      this.target = null;
      Sfx.lose();
      Music.stopCurrent();
      this.time.delayedCall(1500, () => { if (this.state === 'over') Music.want('title-theme'); });
      this.vamps.forEach(v => { if (!v.dead) { v.dead = true; this.batAway(v, -1); } });
      const prog = this.profile.modes[this.modeKey] || {};
      const isBest = !this.practice && this.score > (prog.bestScore || 0);
      this.recordGame();
      const tricky = Object.entries(this.missed).sort((a, b) => b[1] - a[1]).slice(0, 3);
      const trickyLine = tricky.length
        ? 'Keys to practice: ' + tricky.map(([k, n]) => `${k.toUpperCase()} (${n})`).join('   ')
        : 'No missed keys. Sharp shooting!';
      const sessionLine = this.sessionCheered === 'pending' ? this.sessionCheer() : '';
      this.time.delayedCall(700, () => {
        this.hideGlow();
        this.drawSpace(true);
        if (this.practice) {
          this.showPanel({
            y: 300, h: 360, title: 'Practice over',
            body: `Waves cleared: ${this.wave - this.startWave}    Vampires stopped: ${this.kills}\n` +
                  `Accuracy: ${this.accuracy()}%    Speed: ${this.wpm()} WPM    Best streak: ${this.bestStreak}\n\n` +
                  trickyLine + '\nPractice doesn\'t count. Ready for the real hunt?',
            footer: 'Press SPACE to continue',
          });
          this.time.delayedCall(900, () => { this.overReady = true; });
          return;
        }
        this.showPanel({
          y: 300, h: 410 + (sessionLine ? 60 : 0), title: 'The vampires got you!',
          body: sessionLine + `Score ${this.score.toLocaleString()}${isBest ? '   (new best!)' : ''}\n` +
                `Waves cleared: ${this.wave - this.startWave}    Vampires stopped: ${this.kills}\n` +
                `Accuracy: ${this.accuracy()}%    Speed: ${this.wpm()} WPM    Best streak: ${this.bestStreak}\n\n` +
                `Wrong keys: ${this.wrong} (-${this.pointsLost.toLocaleString()} points)${this.mutants ? `   ·   Mutants beaten: ${this.mutants}` : ''}\n` +
                trickyLine + `\nCoins earned: ${this.coinsEarned}   ·   Daily hunt: ${fmtMin(todayMs(this.profile))} of 20:00`,
          footer: 'Press SPACE to continue',
        });
        this.time.delayedCall(900, () => { this.overReady = true; });
      });
    }

    // ---------- Input ----------
    onKey(e) {
      Sfx.init();
      if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
      const k = e.key;
      if ([' ', '/', "'", 'Backspace', 'Tab', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(k)) e.preventDefault();
      switch (this.state) {
        case 'profiles':
          if (/^[1-4]$/.test(k)) this.pickProfile(+k - 1);
          else if (k === 'n' || k === 'N') this.startNaming();
          return;
        case 'naming':
          if (k === 'Escape') this.showProfiles();
          else if (k === 'Enter') this.finishNaming();
          else if (k === 'Backspace') { this.nameBuf = this.nameBuf.slice(0, -1); this.drawName(); }
          else if (k.length === 1 && /[A-Za-z0-9 \-]/.test(k) && this.nameBuf.length < 12) { this.nameBuf += k; Sfx.key(); this.drawName(); }
          return;
        case 'modes':
          if (k === 'Escape') { if (this.practice) this.togglePractice(); else this.showProfiles(); }
          else if (/^[1-5]$/.test(k)) this.pickMode(MODE_ORDER[+k - 1]);
          else if (k === 'p' || k === 'P') this.togglePractice();
          else if (k === 'c' || k === 'C') this.toggleCaps();
          else if ((k === 's' || k === 'S') && !this.practice) this.showShop();
          return;
        case 'intermission':
          if (k === ' ') this.beginWave();
          else if (k === 'Escape') this.quitToModes();
          else if ((k === 'ArrowRight' || k === 'ArrowLeft') && this.wave === this.startWave && this.kills === 0) {
            this.wave = Phaser.Math.Clamp(this.wave + (k === 'ArrowRight' ? 1 : -1), 1, 30); this.startWave = this.wave;
            this.introWave(null);
          }
          return;
        case 'paused':
          if (k === ' ') this.resume(); else if (k === 'Escape') this.quitToModes();
          return;
        case 'shop': {
          const ti = '123'.indexOf(k);
          if (k === 'Escape') this.showModes();
          else if (ti >= 0) this.showShop(SHOP_TABS[ti]);
          else if (k === 'ArrowLeft') this.shopMove(-1, 0);
          else if (k === 'ArrowRight') this.shopMove(1, 0);
          else if (k === 'ArrowUp') this.shopMove(0, -1);
          else if (k === 'ArrowDown') this.shopMove(0, 1);
          else if (k === 'Enter' || k === ' ') this.shopAct(CATALOG[this.shopTab].items[this.shopSel]);
          return;
        }
        case 'over':
          if (k === ' ' && this.overReady) this.showModes();
          return;
      }
      if (this.state !== 'playing') return;
      if (k === 'Escape') { this.pause(); return; }
      if (k === 'Backspace') {
        if (this.target) { const t = this.target; t.typed = 0; this.target = null; this.redrawLabel(t); }
        return;
      }
      if (k.length !== 1 || (k === ' ' && !this.wantsSpace())) return;
      this.typeChar(this.caps ? k : k.toLowerCase());   // with Capitals off, Caps Lock or Shift can't cause a miss
    }

    typeChar(c) {
      const now = this.time.now;
      this.vamps.forEach(a => a.pendingWord && this.nextBossWord(a));   // typing on before the bolt lands
      if (this.jamLeft > 0) { Sfx.clunk(); this.flashKey(c, false); return; }   // jammed: keys do nothing, and don't count as more misses
      const alive = this.vamps.filter(v => !v.dead);
      let v = this.target && !this.target.dead ? this.target : null;
      let expected;
      if (v) expected = v.word[v.typed];
      else {
        this.target = null;
        const cands = alive.filter(a => a.word[0] === c).sort((a, b) => a.x - b.x);
        if (cands.length) { v = cands[0]; this.target = v; expected = c; }
        else { const closest = alive.sort((a, b) => a.x - b.x)[0]; expected = closest ? closest.word[0] : null; }
      }
      if (v && c === expected) {
        const rt = Math.min(3000, now - Math.max(this.lastKeyAt, v.seenAt || now));
        if (c !== ' ') { const st = this.keyStat(physKey(c)); st.hit++; st.ms += Math.max(150, rt); }
        this.hit(v, c);
      } else this.mistake(c, expected, v);
      this.lastKeyAt = now;
    }
    // Space only matters inside the Mutant's sentences. Anywhere else it is ignored, never a miss.
    wantsSpace() { const t = this.target; return !!(t && !t.dead && t.word[t.typed] === ' '); }

    hit(v, c) {
      this.correct++; this.streak++; this.wrongRun = 0;
      this.bestStreak = Math.max(this.bestStreak, this.streak);
      this.flashKey(c, true);
      v.typed++;
      if (v.typed >= v.word.length) { this.target = null; this.redrawLabel(v); this.shoot(v); }
      else { Sfx.key(); this.redrawLabel(v); }
    }

    mistake(c, expected, v) {
      if (!expected) return; // nothing on screen to aim at, so no penalty
      this.wrong++; this.streak = 0;
      if (expected !== ' ') {
        this.missed[physKey(expected)] = (this.missed[physKey(expected)] || 0) + 1;
        this.keyStat(physKey(expected)).miss++;
      }
      Sfx.miss();
      this.flashKey(c, false);
      if (v) { v.shakeUntil = this.time.now + 220; v.tRest.setColor('#ff7b7b'); this.time.delayedCall(220, () => v.tRest && v.tRest.active && v.tRest.setColor('#ffffff')); }
      this.wrongRun++; this.waveWrong++;
      if (!this.practice) {
        const lost = Math.min(this.score, WRONG_COST);
        this.score -= lost; this.pointsLost += lost; this.waveLost += lost;
        this.minusPop(lost);
      }
      if (this.wrongRun >= JAM_AFTER) {
        if (this.practice) {
          // practice is gentle: a reminder instead of a jam
          this.wrongRun = 0;
          this.floatText(HUNTER_X + 60, HUNTER_Y - 230, 'Slow down! In the real hunt\nthat would jam your crossbow.', PRACTICE_COLOR, 18);
        } else this.jam();
      }
      if (!this.practice && !this.mutantDue && this.waveWrong >= MUTANT_AFTER && TYPES.mutant) {
        this.mutantDue = true;
        this.banner('Too many wrong keys!', 170);
        this.time.delayedCall(1300, () => { if (this.state === 'playing' && !this.mutantSpawned) this.banner('A Mutant is coming...', 170); });
        Sfx.growl();
      }
    }
    minusPop(n) {
      this.scoreText.setColor('#ff7b7b');
      this.time.delayedCall(180, () => this.scoreText.active && !this.practice && this.scoreText.setColor('#f4ecff'));
      if (!n) return;
      const pop = this.txt(W - 30, 46, '-' + n, { fontSize: '22px', fontStyle: '700', color: '#ff7b7b', stroke: '#2a0d16', strokeThickness: 4 })
        .setOrigin(1, 0).setDepth(2500);
      this.tweens.add({ targets: pop, y: 76, alpha: 0, duration: 700, onComplete: () => pop.destroy() });
    }
    floatText(x, y, s, color, size = 22) {
      const t = this.txt(x, y, s, { fontSize: size + 'px', fontStyle: '700', color, stroke: '#140c28', strokeThickness: 5, align: 'center' })
        .setOrigin(0.5).setDepth(2400);
      this.tweens.add({ targets: t, y: y - 30, alpha: 0, delay: 900, duration: 700, onComplete: () => t.destroy() });
    }

    // ---------- Jammed crossbow ----------
    jam() {
      this.jamLeft = JAM_MS; this.wrongRun = 0;
      Sfx.jam();
      this.hunter.setTint(0x8f8aa6);
      this.jamText.setVisible(true).setScale(0.5);
      this.tweens.add({ targets: this.jamText, scale: 1, duration: 260, ease: 'Back.out' });
      this.cameras.main.shake(120, 0.004);
      this.jamSmoke = 0;
    }
    unjam(quiet = false) {
      if (!this.jamText) return;
      const was = this.jamLeft > 0 && !quiet;
      this.jamLeft = 0;
      this.jamText.setVisible(false); this.jamBar.clear();
      this.hunter.clearTint();
      if (was && this.state === 'playing') { Sfx.click(); this.floatText(HUNTER_X + 20, HUNTER_Y - 232, 'Fixed!', '#7be08f', 24); }
    }
    updateJam(step) {
      if (this.jamLeft <= 0) return;
      this.jamLeft -= step;
      if (this.jamLeft <= 0) { this.unjam(); return; }
      const g = this.jamBar; g.clear();
      g.fillStyle(0x2c2148, 1); g.fillRoundedRect(HUNTER_X - 50, HUNTER_Y - 210, 100, 8, 4);
      g.fillStyle(0xff7b7b, 1); g.fillRoundedRect(HUNTER_X - 50, HUNTER_Y - 210, Math.max(8, 100 * this.jamLeft / JAM_MS), 8, 4);
      this.jamSmoke -= step;
      if (this.jamSmoke <= 0) {
        this.jamSmoke = 260;
        const p = this.add.image(this.boltX - 10, this.boltY, 'puff').setScale(0.35).setTint(0x9a92b0).setAlpha(0.7).setDepth(1460);
        this.tweens.add({ targets: p, y: p.y - 40, x: p.x + Phaser.Math.Between(-12, 12), scale: 0.8, alpha: 0, duration: 700, onComplete: () => p.destroy() });
      }
    }

    // ---------- Enemies ----------
    pickWord(single = false) {
      const cfg = this.cfg;
      const used = new Set(this.vamps.filter(v => !v.dead).map(v => v.word[0]));
      let w = 'f';
      for (let tries = 0; tries < 12; tries++) {
        if (single || cfg.mode === 'letters' || (cfg.mode === 'pairs' && Math.random() < 0.3)) {
          const pool = [...(cfg.newKeys && Math.random() < 0.4 ? cfg.newKeys : cfg.keys)];
          w = this.weighted(pool, k => this.keyWeight(k));          // weak keys come up more often
        } else if (cfg.mode === 'gen') {
          const n = Phaser.Math.Between(cfg.genLen[0], cfg.genLen[1]), pool = [...cfg.keys];
          w = ''; for (let i = 0; i < n; i++) w += this.weighted(pool, k => this.keyWeight(k));
        } else {
          const cands = Phaser.Utils.Array.Shuffle(cfg.words.slice()).slice(0, 6);
          w = this.weighted(cands, word => [...word].reduce((m, k) => Math.max(m, this.keyWeight(k)), 1));
        }
        if (w.length === 1 || !used.has(w[0])) break;
      }
      if (this.caps && /[a-z]/.test(w)) {
        // Capitals mode: some single letters are capitals, and some words start with a capital.
        if (w.length === 1) { if (Math.random() < 0.45) w = w.toUpperCase(); }
        else if (Math.random() < 0.5) w = w[0].toUpperCase() + w.slice(1);
      }
      return w;
    }
    // The Mega Mutant's sentences: real sentences once every letter is in play, otherwise
    // little phrases made only of the keys this wave uses, so it is never unfair.
    mutantPhrases() {
      const keys = new Set([...this.cfg.keys].map(c => c.toLowerCase()));
      const fits = w => [...w].every(c => keys.has(c));
      const cap = s => this.caps && /[a-z]/.test(s[0]) ? s[0].toUpperCase() + s.slice(1) : s;
      if ([...ALPHA].every(c => keys.has(c))) return Phaser.Utils.Array.Shuffle(SENTENCES.slice()).slice(0, 2).map(cap);
      const words = [...new Set([H2, H3, H4, H5, T2, T3, T4, T5, TMIX, B2, B3, B4, B5, A3, A4, A5].flat())].filter(w => w.length >= 2 && fits(w));
      const out = [];
      for (let i = 0; i < 3; i++) {
        const parts = [];
        for (let j = 0; j < 3; j++) {
          if (words.length >= 5) parts.push(Phaser.Utils.Array.GetRandom(words));
          else { let g = ''; const n = Phaser.Math.Between(2, 3); for (let k = 0; k < n; k++) g += this.weighted([...this.cfg.keys], c => this.keyWeight(c)); parts.push(g); }
        }
        out.push(cap(parts.join(' ')));
      }
      return out;
    }
    pickLane() {
      let best = 0, bestD = -1;
      for (let i = 0; i < LANES.length; i++) {
        const inLane = this.vamps.filter(v => !v.dead && v.lane === i);
        const room = inLane.length ? Math.min(...inLane.map(v => SPAWN_X - v.x)) : 9999;
        const d = room + Math.random() * 60;
        if (d > bestD) { bestD = d; best = i; }
      }
      return best;
    }
    // Which enemy carries this word. Every wave mixes a few kinds; the trickier ones join in later waves.
    pickType(word) {
      const n = word.length, w = this.wave;
      const alive = t => this.vamps.some(v => !v.dead && v.type === t);
      const opts = [['fledgling', 3]];
      if (n === 1) opts.push(['wolf', 1.2], ['mummy', 0.6], ['bat', w >= 3 ? 1.4 : 0]);
      else if (n === 2) opts.push(['ghoul', 3], ['wolf', 1.5]);
      else if (n === 3) opts.push(['ghoul', 1.5], ['armored', 1.5], ['wolf', 1], ['mummy', 1]);
      else opts.push(['armored', 2], ['mummy', 1.6], ['ghoul', n === 4 ? 1 : 0]);
      if (w >= 2) opts.push(['ghost', 1]);
      if (w >= 3) opts.push(['shield', 0.9]);
      if (w >= 4 && !alive('bigbat')) opts.push(['bigbat', 0.6]);
      const ok = opts.filter(([t, wt]) => wt > 0 && TYPES[t] && this.textures.exists(TYPES[t].sheet));
      return this.weighted(ok, o => o[1])[0];
    }
    labelUp(v) { return v.T.lu || (v.T.flying ? 170 : v.T.h + 33); }
    hitY(v) { return v.T.flying ? v.y - 95 : v.y - v.T.h * 0.5; }
    attackX(v) { return ATTACK_X + (v.boss ? 50 : 0); }

    spawnVamp(type, wordIn, queue, opts = {}) {
      const word = wordIn || this.pickWord();
      type = type || this.pickType(word);
      const T = TYPES[type], sc = T.scale || 2;
      if (T.shield && !queue) queue = [this.pickWord()];   // the shield word comes first, then the guard's own
      const lane = opts.lane != null ? opts.lane : T.boss ? 1 : this.pickLane(), y = LANES[lane];
      const x0 = opts.x != null ? opts.x : T.boss ? W - 170 : SPAWN_X;
      const v = {
        type, T, word, display: word, typed: 0, lane, x: x0, y,
        speed: this.cfg.speed * this.pace * T.speed * Phaser.Math.FloatBetween(0.92, 1.08),
        walk: Math.random() * 6, dead: false, shakeUntil: 0, holdUntil: 0, boss: !!T.boss, queue: queue || [], minion: !!opts.extra,
      };
      v.shadow = this.add.ellipse(v.x, y, T.boss ? 110 * sc / 2 : 70, T.flying ? 10 : 16, 0x000000, T.flying ? 0.2 : 0.35).setDepth(y - 1);
      v.spr = this.add.sprite(v.x, y, T.sheet, 0).setOrigin(T.ox, T.oy).setScale(sc).setDepth(y);
      if (T.tint) v.spr.setTint(T.tint);
      if (T.alpha) v.spr.setAlpha(T.alpha);
      if (T.anim) v.spr.play({ key: T.anim, startFrame: Phaser.Math.Between(0, 5) });
      if (T.flap) this.tweens.add({ targets: v.spr, scaleY: { from: sc, to: sc * 0.68 }, duration: 130, yoyo: true, repeat: -1 });
      if (T.ghost) this.tweens.add({ targets: v.spr, alpha: { from: 0.85, to: 0.4 }, duration: 900, yoyo: true, repeat: -1 });
      v.plate = this.add.graphics();
      v.tDone = this.txt(0, 0, '', { fontSize: '30px', fontStyle: '700', color: '#7be08f' }).setOrigin(0, 0.5);
      v.tRest = this.txt(0, 0, '', { fontSize: '30px', fontStyle: '700', color: '#ffffff' }).setOrigin(0, 0.5);
      const parts = [v.plate, v.tDone, v.tRest];
      if (v.boss) {
        v.tBoss = this.txt(0, -42, '', { fontSize: '16px', fontStyle: '700', color: T.mutant ? '#9be15d' : '#ffcf5a', stroke: '#2a0d16', strokeThickness: 4 }).setOrigin(0.5);
        parts.push(v.tBoss);
      }
      v.label = this.add.container(v.x, y - this.labelUp(v), parts).setDepth(1500 + y);
      this.redrawLabel(v);
      this.vamps.push(v);
      if (!v.boss && !opts.extra) this.spawned++;
      return v;
    }
    spawnBoss() {
      let type = BOSS_FOR_SCENE[this.sceneId];
      if (!TYPES[type] || !this.textures.exists(TYPES[type].sheet)) type = 'count';
      const T = TYPES[type], words = Phaser.Utils.Array.Shuffle(this.cfg.boss.slice());
      for (let i = 0; i < (T.extraWords || 0); i++) words.push(this.cfg.words && this.cfg.words.length ? Phaser.Utils.Array.GetRandom(this.cfg.words) : this.pickWord());
      const v = this.spawnVamp(type, words.shift(), words);
      this.banner(T.name + '!');
      this.burst(v.x, this.hitY(v), 30, 1.3);
      Sfx.tone(110, 0.6, 'sawtooth', 0.06, 70); Sfx.tone(165, 0.6, 'sawtooth', 0.04, 100, 0.15);
      this.bossCast(v);
      Music.want('boss-fight');
    }
    spawnMutant() {
      this.mutantSpawned = true;
      const words = this.mutantPhrases();
      const v = this.spawnVamp('mutant', words.shift(), words, { x: W - 300 });
      v.unit = [...ALPHA].every(c => this.cfg.keys.includes(c)) ? 'sentence' : 'phrase';
      this.redrawLabel(v);
      this.banner('MEGA MUTANT!');
      this.burst(v.x, this.hitY(v), 40, 1.8);
      this.cameras.main.shake(400, 0.012);
      Sfx.growl();
      this.bossCast(v, 1500);
      this.floatText(640, 250, 'Type its whole sentence, spaces too!', '#9be15d', 24);
      Music.want('boss-fight');
    }
    bossCast(v, hold = 950) {
      const T = v.T;
      v.holdUntil = this.time.now + hold;
      if (T.cast && this.anims.exists(T.cast)) {
        v.spr.play(T.cast);
        v.spr.once('animationcomplete-' + T.cast, () => { if (!v.removed) v.spr.play(T.anim); });
      } else {
        v.spr.setTintFill(0xffffff); this.time.delayedCall(120, () => v.spr.active && v.spr.clearTint());
      }
      if (T.trick === 'bats') this.summon(v, 'bat', 2, 3, true);
      if (T.trick === 'minions') this.summon(v, 'mummy', 1, 2, false);
    }
    // Bosses that call helpers: the Bat Queen's letter bats and Pharaoh Mumbles' little mummies.
    summon(boss, type, n, cap, single) {
      if (!TYPES[type]) return;
      this.time.delayedCall(450, () => {
        if (boss.removed || this.state !== 'playing') return;
        const have = this.vamps.filter(a => !a.dead && a.minion).length;
        for (let i = 0; i < Math.min(n, cap - have); i++) {
          const m = this.spawnVamp(type, this.pickWord(single), null, { extra: true, x: boss.x - 50 - i * 70, lane: Phaser.Math.Between(0, 2) });
          this.burst(m.x, this.hitY(m), 8, 0.6);
        }
      });
    }
    redrawLabel(v) {
      const done = v.display.slice(0, v.typed), rest = v.display.slice(v.typed);
      v.tDone.setText(done); v.tRest.setText(rest);
      const wDone = done ? v.tDone.width : 0, total = wDone + v.tRest.width;
      v.tDone.setX(-total / 2); v.tRest.setX(-total / 2 + wDone);
      const pw = Math.max(46, total + 26), ph = 46, locked = this.target === v;
      const edge = locked ? 0xffcf5a : v.T.mutant ? 0x9be15d : v.boss ? 0xd94848 : 0x7a55c8;
      const g = v.plate; g.clear();
      g.fillStyle(locked ? 0x2e1f05 : 0x140c28, 0.92); g.fillRoundedRect(-pw / 2, -ph / 2, pw, ph, 12);
      g.lineStyle(3, edge, 1); g.strokeRoundedRect(-pw / 2, -ph / 2, pw, ph, 12);
      g.fillStyle(edge, 1); g.fillTriangle(-7, ph / 2, 7, ph / 2, 0, ph / 2 + 8);
      if (v.T.shield && v.queue.length) {
        // a shield badge on the left: this word only breaks the shield, then the guard's own word shows
        const sx = -pw / 2 - 4, sy = 0;
        const pts = [{ x: sx - 13, y: sy - 15 }, { x: sx + 13, y: sy - 15 }, { x: sx + 13, y: sy + 1 }, { x: sx, y: sy + 17 }, { x: sx - 13, y: sy + 1 }];
        g.fillStyle(0xcfd8dc, 1); g.fillPoints(pts, true);
        g.lineStyle(3, 0x5b6770, 1); g.strokePoints(pts, true, true);
        g.fillStyle(0x8a5a2b, 1); g.fillRect(sx - 3, sy - 11, 6, 22); g.fillRect(sx - 9, sy - 5, 18, 6);
      }
      v.labelW = pw + 30;
      if (v.tBoss) {
        const left = v.queue.length + 1, unit = v.unit || 'word';
        v.tBoss.setText(`${v.T.name.toUpperCase()}  ·  ${left} ${unit}${left === 1 ? '' : 's'} left`);
        v.labelW = Math.max(v.labelW, v.tBoss.width + 20);
      }
    }
    removeVamp(v) {
      v.removed = true;
      this.tweens.killTweensOf(v.spr);
      [v.spr, v.shadow, v.label].forEach(o => o && o.active && o.destroy());
    }

    // Pace adapts to the player: stop vampires far away and they come faster; get bitten and they slow down.
    adjustPace(delta) { this.pace = Phaser.Math.Clamp(this.pace + delta, 0.7, 1.8); }

    shoot(v) {
      const finishing = v.queue.length === 0;
      // A doomed enemy can't be targeted or bite any more, but keeps walking until the bolt lands.
      if (finishing) { v.dead = true; v.doomed = true; this.kills++; }
      if (!v.boss && !v.minion) {
        const far = (v.x - ATTACK_X) / (SPAWN_X - ATTACK_X);
        this.adjustPace(far > 0.6 ? 0.03 : far > 0.4 ? 0.012 : far < 0.2 ? -0.04 : 0);
      }
      // The Mutant is a penalty, so it gives no points or coins: the reward is getting rid of it.
      const gain = this.practice || v.T.mutant ? 0 : Math.round((10 * v.word.length * this.mult() + (v.boss && finishing ? 200 : 0)) * (this.caps ? CAPS_BONUS : 1));
      this.score += gain;
      Sfx.shoot();
      this.hunter.play(this.lookId + '-shoot');
      if (finishing && !v.T.mutant) this.addCoins(v.word.length + (v.boss ? 30 : 0));
      const sx = this.boltX, sy = this.boltY, boltId = this.profile.bolt;
      const bkey = this.textures.exists('bolt-' + boltId) ? 'bolt-' + boltId : 'bolt';
      const spin = boltId === 'garlic';
      const bolt = this.add.image(sx, sy, bkey).setRotation(Phaser.Math.Angle.Between(sx, sy, v.x, this.hitY(v))).setDepth(1400);
      const dist = Phaser.Math.Distance.Between(sx, sy, v.x, this.hitY(v));
      if (!finishing) v.pendingWord = v.queue.shift();
      const flight = { t: 0 };
      this.tweens.add({
        targets: flight, t: 1, duration: Math.max(80, dist / 2400 * 1000),
        onUpdate: () => {   // home in on the enemy while it keeps walking
          const tx = v.x, ty = v.T.flying && v.spr.active ? v.spr.y : this.hitY(v);
          bolt.setPosition(sx + (tx - sx) * flight.t, sy + (ty - sy) * flight.t).setRotation(spin ? flight.t * 12 : Phaser.Math.Angle.Between(sx, sy, tx, ty));
        },
        onComplete: () => { bolt.destroy(); v.doomed = false; if (finishing) this.vanquish(v, gain); else this.bossHit(v, gain); },
      });
    }
    burst(x, y, n, scale = 1) {
      const puff = this.add.particles(x, y, 'puff', {
        speed: { min: 60 * scale, max: 230 * scale }, scale: { start: 0.9 * scale, end: 0 }, alpha: { start: 0.85, end: 0 },
        lifespan: 600, tint: BOLT_FX[(this.profile && this.profile.bolt) || 'oak'] || BOLT_FX.oak, emitting: false,
      }).setDepth(1450);
      puff.explode(n);
      const sparks = this.add.particles(x, y, 'spark', {
        speed: { min: 120 * scale, max: 300 * scale }, scale: { start: 0.8, end: 0 }, lifespan: 500, tint: 0xffcf5a, emitting: false,
      }).setDepth(1451);
      sparks.explode(Math.ceil(n / 2));
      this.time.delayedCall(900, () => { puff.destroy(); sparks.destroy(); });
    }
    scorePop(x, y, gain) {
      if (!gain) return;   // practice: no points to show
      const pop = this.txt(x, y - 70, '+' + gain, { fontSize: '28px', fontStyle: '700', color: '#ffcf5a', stroke: '#3b1a5a', strokeThickness: 5 })
        .setOrigin(0.5).setDepth(2400);
      this.tweens.add({ targets: pop, y: y - 120, alpha: 0, duration: 800, onComplete: () => pop.destroy() });
    }
    nextBossWord(v) {
      if (!v.pendingWord) return;
      v.word = v.display = v.pendingWord; v.pendingWord = null; v.typed = 0;
      this.redrawLabel(v);
    }
    // A hit that doesn't finish the enemy yet: a boss word, a Mutant sentence or a guard's shield.
    bossHit(v, gain) {
      if (v.removed) return;
      this.nextBossWord(v);
      Sfx.poof();
      const y = this.hitY(v), T = v.T;
      this.burst(v.x, y, 10, 0.7);
      this.scorePop(v.x, y, gain);
      if (T.shield) {
        this.floatText(v.x, y - 60, 'Shield broken!', '#cfd8dc', 20);
        v.x = Math.min(SPAWN_X - 60, v.x + 30);
        return;
      }
      v.spr.setTintFill(0xffffff);
      this.time.delayedCall(90, () => v.spr.active && (T.tint ? v.spr.setTint(T.tint) : v.spr.clearTint()));
      const knock = T.trick === 'charge' ? 110 : T.mutant ? 90 : 50;
      v.x = Math.min(SPAWN_X - 60, v.x + knock);   // a small knock back; he walks faster to make up for it
      if (T.trick === 'bats' || T.trick === 'minions') this.bossCast(v, 700);
      if (T.trick === 'blink') this.blink(v);
    }
    // The Ghost Knight vanishes and pops up in another lane, a bit further away.
    blink(v) {
      this.burst(v.x, this.hitY(v), 14, 0.9);
      const lanes = [0, 1, 2].filter(l => l !== v.lane);
      v.lane = Phaser.Utils.Array.GetRandom(lanes); v.y = LANES[v.lane];
      v.x = Phaser.Math.Clamp(v.x + Phaser.Math.Between(60, 240), ATTACK_X + 320, W - 170);
      v.spr.setDepth(v.y); v.shadow.setDepth(v.y - 1); v.label.setDepth(1500 + v.y);
      v.spr.setAlpha(0);
      this.tweens.add({ targets: v.spr, alpha: v.T.alpha || 1, duration: 450 });
      v.holdUntil = this.time.now + 500;
    }
    vanquish(v, gain) {
      Sfx.poof();
      const y = this.hitY(v);
      this.burst(v.x, y, v.boss ? 40 : 18, v.boss ? 1.6 : 1);
      this.scorePop(v.x, y, gain);
      if (v.boss) {
        if (v.T.mutant) this.mutants++;
        else if (!this.practice) this.profile.ach.bossKills++;
        this.checkUnlocks(); this.banner(v.T.flees || 'Boss beaten!');
        if (!Music.sting('wave-cleared')) Sfx.fanfare();
        Music.want(this.battleMusic || 'battle-loop');
      }
      if (v.T.split) {
        // the big bat bursts into two little bats, each with a letter
        [-1, 1].forEach((d, i) => {
          const b = this.spawnVamp('bat', this.pickWord(true), null, { extra: true, x: v.x + 40 + i * 60, lane: Phaser.Math.Clamp(v.lane + d, 0, 2) });
          this.burst(b.x, this.hitY(b), 6, 0.5);
        });
        this.floatText(v.x, y - 70, 'It split!', '#c9a3ff', 22);
      }
      this.batAway(v, 1);
    }
    batAway(v, dir) {
      const bat = this.add.image(v.x, this.hitY(v), 'batFly').setScale(v.boss ? 1.2 : 0.6).setDepth(1460).setFlipX(dir > 0);
      this.removeVamp(v);
      this.tweens.add({ targets: bat, scaleY: { from: bat.scaleX, to: bat.scaleX * 0.5 }, duration: 110, yoyo: true, repeat: 8 });
      this.tweens.add({
        targets: bat, x: v.x + dir * Phaser.Math.Between(180, 320), y: -60, alpha: 0.3,
        duration: 1400, ease: 'Sine.in', onComplete: () => bat.destroy(),
      });
    }
    vampAttack(v) {
      if (this.target === v) this.target = null;
      this.hearts = Math.max(0, this.hearts - (v.boss ? 2 : 1));
      this.adjustPace(-0.15);
      this.updateHearts();
      Sfx.hurt();
      this.cameras.main.shake(v.boss ? 260 : 160, v.boss ? 0.01 : 0.006);
      this.hunter.play(this.lookId + '-hurt');
      this.hunter.setTintFill(0xff6b6b);
      this.time.delayedCall(120, () => { this.hunter.clearTint(); if (this.jamLeft > 0) this.hunter.setTint(0x8f8aa6); });
      const ouch = this.txt(HUNTER_X, HUNTER_Y - 200, v.boss ? 'Ouch! -2' : 'Ouch!', { fontSize: '26px', fontStyle: '700', color: '#ff7b7b', stroke: '#2a0d16', strokeThickness: 5 })
        .setOrigin(0.5).setDepth(2400);
      this.tweens.add({ targets: ouch, y: HUNTER_Y - 240, alpha: 0, duration: 800, onComplete: () => ouch.destroy() });
      if (v.boss) {
        // The boss vanishes in smoke and reappears further back, still carrying its word.
        // The Mutant keeps the letters already typed: its sentences are long.
        this.burst(v.x, this.hitY(v), 20, 1.2);
        v.x = Math.min(SPAWN_X - 60, v.x + 560); this.nextBossWord(v);
        if (!v.T.mutant) v.typed = 0;
        this.redrawLabel(v);
        this.bossCast(v);
      } else {
        v.dead = true;
        if (v.type === 'fledgling') v.spr.play('v-bite');
        this.tweens.add({ targets: [v.spr], x: HUNTER_X + 70, duration: 140, yoyo: true, onComplete: () => this.batAway(v, 1) });
      }
      if (this.hearts <= 0) this.gameOver();
    }
    // How fast an enemy moves right now: ghosts drift in bursts, Grizzlefang howls and charges.
    speedNow(v, time) {
      const T = v.T;
      if (T.ghost) return 0.3 + 1.3 * Math.max(0, Math.sin(v.walk * 0.35));
      if (T.trick === 'charge') {
        if (!v.nextCharge) v.nextCharge = time + 4500;
        if (time >= v.nextCharge && time >= v.holdUntil) {
          v.nextCharge = time + Phaser.Math.Between(5500, 7000);
          v.chargeFrom = time + 800; v.chargeUntil = time + 2000;
          this.bossCast(v, 800); Sfx.growl();
          this.floatText(v.x, this.hitY(v) - 120, 'AWOOO!', '#ffcf5a', 24);
        }
        if (time >= v.chargeFrom && time < v.chargeUntil) return 2.4;
      }
      return 1;
    }

    update(time, delta) {
      if (this.state !== 'playing') return;
      const step = Math.min(delta, 100), dt = step / 1000;
      this.activeMs += step;
      this.addPlayTime(step);
      this.updateJam(step);
      this.spawnClock -= delta;
      if (this.spawned < this.cfg.count && this.spawnClock <= 0) {
        this.spawnVamp();
        this.spawnClock = this.cfg.gap / this.pace * Phaser.Math.FloatBetween(0.8, 1.15);
      }
      if (this.cfg.boss && !this.bossSpawned && this.spawned >= this.cfg.count && this.vamps.every(v => v.dead)) {
        this.bossSpawned = true;
        this.spawnBoss();
      }
      // Too many wrong keys this wave: the Mega Mutant comes once everything else is gone.
      if (this.mutantDue && !this.mutantSpawned && this.spawned >= this.cfg.count && (!this.cfg.boss || this.bossSpawned) && this.vamps.length === 0 && !this.clearing) {
        this.spawnMutant();
      }
      for (const v of this.vamps) {
        if (v.removed || (v.dead && !v.doomed)) continue;
        if (time >= v.holdUntil) v.x -= v.speed * dt * this.speedNow(v, time);
        if (!v.seenAt && v.x < W - 30) v.seenAt = time;
        v.walk += dt * 9;
        const sy = v.T.flying ? v.y - 95 + Math.sin(v.walk * 0.7) * 14 : v.y;
        v.spr.setPosition(v.x, sy);
        v.shadow.setPosition(v.x, v.y);
        const shake = time < v.shakeUntil ? Math.sin(time * 0.09) * 6 : 0;
        const half = (v.labelW || 80) / 2;
        v.label.setPosition(Phaser.Math.Clamp(v.x, half + 6, W - half - 6) + shake, v.y - this.labelUp(v));   // long labels stay on screen
        if (!v.dead && v.x <= this.attackX(v)) this.vampAttack(v);
        if (this.state !== 'playing') break;
      }
      this.vamps = this.vamps.filter(v => !v.removed);
      if (this.state === 'playing' && this.spawned >= this.cfg.count && (!this.cfg.boss || this.bossSpawned) && (!this.mutantDue || this.mutantSpawned) && this.vamps.length === 0 && !this.clearing) {
        this.clearing = true;
        this.time.delayedCall(650, () => { this.clearing = false; this.waveCleared(); });
      }
      if (this.state === 'playing') this.updateHud();
      this.updateNextKey();
    }
  }

  function boot() {
    const el = document.getElementById('loading'); if (el) el.remove();
    new Phaser.Game({
      type: Phaser.AUTO, parent: 'game', width: W, height: H, backgroundColor: '#0d0a1a',
      scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
      input: { keyboard: false },
      scene: [Hunt],
    });
  }
  const fonts = document.fonts
    ? Promise.all(['700 30px Fredoka', '500 20px Fredoka', '600 18px Fredoka', '50px Creepster'].map(f => document.fonts.load(f)))
    : Promise.resolve();
  Promise.race([fonts, new Promise(r => setTimeout(r, 2500))]).catch(() => {}).then(boot);
})();
</script>
