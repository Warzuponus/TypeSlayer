<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TypeSlayer the Vampire Hunter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@500;600;700&display=swap">
<style>
  /* Single dark "moonlit graveyard" look on purpose: the game always plays at night. */
  :root {
    --night: #0d0a1a;
    --ink: #f4ecff;
    --gold: #ffcf5a;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--ink);
    overflow: hidden;
    font-family: Fredoka, "Trebuchet MS", system-ui, sans-serif;
  }
  #game { width: 100%; height: 100%; }
  /* The grown-ups page: plain HTML over the game. */
  #grownups { position: fixed; inset: 0; z-index: 10; overflow-y: auto; background: rgba(13, 10, 26, 0.97); color: var(--ink); font-size: 15px; }
  #grownups[hidden] { display: none; }
  #grownups button { font: inherit; color: inherit; cursor: pointer; }
  .gu-pin { max-width: 360px; margin: 10vh auto; padding: 0 16px; text-align: center; }
  .gu-pin h2 { font-size: 22px; color: var(--gold); font-weight: 600; }
  .gu-dots { display: flex; gap: 14px; justify-content: center; margin: 18px 0 6px; }
  .gu-dot { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #7a55c8; display: grid; place-items: center; font-weight: 700; }
  .gu-dot.on { background: #7a55c8; }
  .gu-msg { min-height: 22px; color: #ff9b9b; margin: 4px 0; }
  .gu-pad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; justify-content: center; }
  .gu-key { height: 56px; border-radius: 14px; border: 2px solid #3d2b63; background: #140c28; font-size: 22px; font-weight: 600; }
  .gu-key:hover, .gu-btn:hover, .gu-tab:hover { border-color: var(--gold); }
  .gu-small { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .gu-link { background: none; border: 0; color: #cbbcec; text-decoration: underline; }
  .gu-page { max-width: 1140px; margin: 0 auto; padding: 16px; }
  .gu-page header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .gu-page h1 { font-size: 28px; color: var(--gold); margin: 0 12px 0 0; font-weight: 700; }
  .gu-page nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .gu-grow { flex: 1; }
  .gu-tab, .gu-btn { border: 2px solid #3d2b63; background: #140c28; border-radius: 12px; padding: 6px 14px; font-weight: 600; }
  .gu-tab.on { border-color: #7be08f; color: #7be08f; }
  .gu-copied { color: #7be08f; margin: 8px 0 0; }
  .gu-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 16px 0; }
  .gu-tile { background: #1b1233; border: 1px solid #3d2b63; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .gu-tile b { font-size: 26px; color: #fff; }
  .gu-tile span { color: #cbbcec; font-size: 13px; }
  .gu-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .gu-card { background: #1b1233; border: 1px solid #3d2b63; border-radius: 16px; padding: 14px 16px; min-width: 0; }
  .gu-card h2 { font-size: 18px; margin: 0 0 10px; font-weight: 600; color: #fff; }
  .gu-h2b { margin-top: 18px !important; }
  .gu-note { color: #9a8bc2; font-size: 13px; margin: 8px 0; }
  .gu-grid { display: grid; grid-template-columns: 22px repeat(10, minmax(0, 1fr)); gap: 3px; max-width: 440px; }
  .gu-hd { color: #9a8bc2; font-size: 12px; display: grid; place-items: center; }
  .gu-cell { aspect-ratio: 1; border: 2px solid transparent; border-radius: 6px; font-size: 12px; font-weight: 600; color: #140c28; padding: 0; }
  .gu-cell.sel { border-color: #fff; }
  .gu-detail p { margin: 8px 0 0; line-height: 1.5; }
  .gu-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: #cbbcec; }
  .gu-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .gu-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .gu-tip { color: var(--gold); font-size: 14px; }
  .gu-map { list-style: none; padding: 0; margin: 0; }
  .gu-map li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid #2c2148; }
  .gu-map li.off { color: #7d6fa3; }
  .gu-map small { color: #9a8bc2; }
  .gu-map .gold { color: var(--gold); font-style: normal; font-weight: 600; }
  .gu-speed { display: flex; flex-wrap: wrap; gap: 8px 10px; }
  .gu-kb { display: flex; flex-direction: column; gap: 4px; }
  .gu-kbrow { display: flex; gap: 4px; }
  .gu-k { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; font-size: 13px; font-weight: 600; color: #140c28; }
  .gu-k.good, .gu-legend .good { background: #7be08f; }
  .gu-k.mid, .gu-legend .mid { background: #ffb547; }
  .gu-k.bad, .gu-legend .bad { background: #ff6b6b; }
  .gu-k.none, .gu-legend .none { background: #3d2b63; color: #cbbcec; }
  .gu-card label { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 8px 0; }
  .gu-card select { font: inherit; background: #140c28; color: var(--ink); border: 2px solid #3d2b63; border-radius: 10px; padding: 4px 8px; }
  .gu-card .gu-check { justify-content: flex-start; }
  #loading {
    position: fixed; inset: 0; display: grid; place-items: center;
    font-size: 20px; color: var(--gold);
  }
</style>

<div id="game"></div>
<div id="grownups" hidden></div>

<script>
(() => {
  const SHEETS = window.VH_SHEETS || {};
  const W = 1280, H = 720;
  const LANES = [415, 465, 515];           // feet height of each lane
  const HUNTER_X = 112, HUNTER_Y = 465;
  const ATTACK_X = 232;                    // an enemy that reaches here bites
  const SPAWN_X = W + 60;
  const MAX_HEARTS = 5;
  const PART_MS = 10 * 60 * 1000;          // one daily hunt = 10 minutes of typing and 10 minutes of Math Hunt
  const FONT = 'Fredoka, "Trebuchet MS", system-ui, sans-serif';
  const TITLE_FONT = 'Creepster, Impact, fantasy';

  // Enemy types: which sprite, where its feet are in the frame, how tall it stands (at 2x) and how fast it moves.
  // Newer foes come from enemies.js (VH_FOES): sheet keys, feet position and figure height are measured from the art.
  const FOES = window.VH_FOES || {};
  const foe = (id, anim, extra) => FOES[id] && FOES[id][anim]
    ? Object.assign({ sheet: FOES[id][anim].sheet, anim: `${id}-${anim}`, ox: FOES[id][anim].ox, oy: FOES[id][anim].oy, h: FOES[id][anim].fh * (extra.scale || 2) }, extra)
    : null;
  const TYPES = {
    fledgling: { sheet: 'vampWalk',    anim: 'v-walk', ox: 63 / 124, oy: 105 / 124, h: 172, speed: 1 },
    armored:   { sheet: 'armoredWalk', anim: 'a-walk', ox: 65 / 124, oy: 106 / 124, h: 180, speed: 0.72 },
    ghoul:     { sheet: 'ghoulRun',    anim: 'g-run',  ox: 65 / 132, oy: 112 / 132, h: 184, speed: 1.25 },
    bat:       { sheet: 'batFly',      anim: null,     ox: 0.5, oy: 0.5, h: 90, speed: 1.2, flying: true, flap: true },
    // A giant bat that splits into two little letter bats when it is hit.
    bigbat:    { sheet: 'batFly',      anim: null,     ox: 0.5, oy: 0.5, h: 150, speed: 0.85, flying: true, flap: true, scale: 3.2, tint: 0xc9a3ff, split: true, lu: 215 },
    // A see-through ghost that drifts forward in bursts.
    ghost:     FOES.ghost && { sheet: FOES.ghost.img, anim: null, ox: 0.5, oy: 0.5, h: 140, speed: 1.2, flying: true, ghost: true, scale: 2.4, lu: 205 },
    wolf:      foe('wolf', 'run', { speed: 1.45, fps: 14 }),
    mummy:     foe('mummy', 'walk', { speed: 0.6, fps: 7 }),
    // A guard with a shield word in front: type the shield word first, then the vampire's own word.
    shield:    foe('shield', 'walk', { speed: 0.72, fps: 8, shield: true }),
    // Bosses. Each setting has its own, with its own trick. Count Moonfang is the default.
    count:     { sheet: 'countWalk',   anim: 'c-walk', ox: 96 / 176, oy: 150 / 176, h: 246, speed: 0.85, boss: true, name: 'Count Moonfang', cast: 'c-cast', trick: 'knock', flees: 'Moonfang flees!' },
    batqueen:  foe('batqueen', 'walk', { speed: 0.8, fps: 8, boss: true, name: 'Queen Vespera', cast: 'batqueen-cast', trick: 'bats', flees: 'The Bat Queen flies off!' }),
    werewolf:  foe('werewolf', 'walk', { speed: 0.62, fps: 9, boss: true, name: 'Grizzlefang', cast: 'werewolf-cast', trick: 'charge', flees: 'Grizzlefang runs home!' }),
    pharaoh:   foe('pharaoh', 'walk', { speed: 0.6, fps: 7, boss: true, name: 'Pharaoh Mumbles', cast: 'pharaoh-cast', trick: 'minions', extraWords: 2, flees: 'Pharaoh Mumbles unravels!' }),
    ghostknight: foe('ghostknight', 'walk', { speed: 0.8, fps: 8, boss: true, name: 'The Ghost Knight', cast: 'ghostknight-cast', trick: 'blink', alpha: 0.85, flees: 'The Ghost Knight fades away!' }),
    // Brought out by too many wrong keys in one wave: slow, huge, and beaten with whole sentences.
    mutant:    foe('mutant', 'walk', { speed: 0.3, fps: 6, boss: true, mutant: true, scale: 2.3, name: 'Mega Mutant', cast: 'mutant-cast', trick: 'knock', flees: 'The Mutant melts away!' }),
    // Math Hunt bosses (mathart.js): the Beetle Baron's shell bounces him back further, the Countess drops into another lane.
    beetle:    foe('beetle', 'walk', { speed: 0.7, fps: 9, boss: true, name: 'Beetle Baron', cast: 'beetle-cast', trick: 'shell', flees: 'The Beetle Baron scuttles off!' }),
    weaver:    foe('weaver', 'walk', { speed: 0.75, fps: 8, boss: true, name: 'Countess Weaver', cast: 'weaver-cast', trick: 'blink', flees: 'Countess Weaver climbs away!' }),
    // The castle's final boss: Count Moonfang returns, bigger, glowing and tinted.
    kingcount: { sheet: 'countWalk', anim: 'c-walk', ox: 96 / 176, oy: 150 / 176, h: 300, lu: 290, scale: 2.45, speed: 0.8, boss: true, name: 'Count Moonfang', cast: 'c-cast',
                 trick: 'knock', tint: 0xffb3dc, aura: 0xff5ab0, flees: 'Moonfang is beaten for good!' },
  };
  Object.keys(TYPES).forEach(k => { if (!TYPES[k]) delete TYPES[k]; });
  const BOSS_FOR_SCENE = { cave: 'batqueen', forest: 'werewolf', crypt: 'pharaoh', courtyard: 'ghostknight' };

  // ---------- Wrong keys ----------
  const WRONG_COST = 5;        // points lost for each wrong key
  const JAM_AFTER = 4;         // this many wrong keys in a row jams the crossbow...
  const JAM_MS = 3000;         // ...for 3 seconds
  const MUTANT_AFTER = 15;     // this many wrong keys in one wave brings the Mega Mutant at the end of it
  const SENTENCES = [
    'the bat flew over the moon', 'a ghost ate my homework', 'vampires hate garlic pizza', 'the mummy lost his socks',
    'my crossbow never misses', 'the wolf howls at night', 'count moonfang has bad breath', 'the castle gate is open',
    'bats sleep upside down', 'a spooky owl said hoot', 'the hunter saves the town', 'type fast and stay calm',
    'garlic bread keeps vampires away', 'the moon is big and bright', 'skeletons love to dance', 'never trust a smiling bat',
    'the ghost wore a bedsheet', 'my cape is very fancy', 'the frog jumped in the fog', 'zombies walk very slowly',
  ];

  // ---------- Hunter looks (characters and outfits) ----------
  // Each look has idle, shoot and hurt sheets, where its feet sit in the frame, and where its crossbow tip is (at 2x).
  const LOOKS = Object.assign({
    rook: { idle: 'hunterIdle', shoot: 'hunterShoot', hurt: 'hunterHurt', ox: 71 / 132, oy: 112 / 132, tipX: 74, tipY: -58, shootStart: 3 },
  }, window.VH_LOOKS || {});
  const hasLook = id => !!LOOKS[id] && !!SHEETS[LOOKS[id].idle];

  // ---------- Shop catalog ----------
  const NEEDS = {
    garlic:  { text: 'Beat 3 bosses', ok: p => p.ach.bossKills >= 3, prog: p => `${Math.min(3, p.ach.bossKills)} of 3` },
    holy:    { text: 'Finish a game with 95% accuracy', ok: p => p.ach.bestAcc >= 95, prog: p => `best so far ${p.ach.bestAcc}%` },
    sun:     { text: 'Reach 20 words per minute', ok: p => p.ach.bestWpm >= 20, prog: p => `best so far ${p.ach.bestWpm} WPM` },
    sunfire: { text: 'Beat every mode with Capitals on', ok: p => MODE_ORDER.every(m => p.ach.capsCleared[m]),
               prog: p => `${MODE_ORDER.filter(m => p.ach.capsCleared[m]).length} of 5 modes` },
  };
  const CATALOG = {
    hunters: { title: 'Hunters', items: [
      { id: 'rook', name: 'Rook', price: 0, blurb: 'The original hunter' },
      { id: 'ivy', name: 'Ivy', price: 0, blurb: 'Sharp eyes, red braid' },
      { id: 'grimsby', name: 'Grandpa Grimsby', price: 300, blurb: '50 years of hunting' },
      { id: 'clank', name: 'Sir Clank', price: 500, blurb: 'A robot with a crossbow' },
    ] },
    outfits: { title: 'Outfits', items: [
      { id: 'ranger', name: 'Moonlight Ranger', price: 300, blurb: 'Silver cloak, glowing goggles' },
      { id: 'knight', name: 'Knight Armor', price: 400, blurb: 'A full suit of shining armor' },
      { id: 'pirate', name: 'Pirate Hunter', price: 450, blurb: 'Yo ho, vampires!' },
      { id: 'ninja', name: 'Shadow Ninja', price: 500, blurb: 'Silent and swift' },
      { id: 'nightbat', name: 'Moonbat Suit', price: 700, blurb: 'Bat-wing cape, glowing goggles' },
      { id: 'sunfire', name: 'Sunfire Champion', price: 0, ultimate: true, need: 'sunfire', blurb: 'The ultimate outfit' },
    ] },
    bolts: { title: 'Bolts', items: [
      { id: 'oak', name: 'Oak Bolt', price: 0, blurb: 'Trusty and true' },
      { id: 'silver', name: 'Silver Bolt', price: 150, blurb: 'Vampires hate silver' },
      { id: 'fire', name: 'Fire Bolt', price: 300, blurb: 'Leaves a trail of sparks' },
      { id: 'ice', name: 'Ice Bolt', price: 300, blurb: 'Brrr!' },
      { id: 'garlic', name: 'Garlic Bomb', price: 400, need: 'garlic', blurb: 'Smelly but strong' },
      { id: 'holy', name: 'Holy Water', price: 500, need: 'holy', blurb: 'A splash of blue light' },
      { id: 'sun', name: 'Sunbeam', price: 600, need: 'sun', blurb: 'Pure sunlight' },
    ] },
  };
  const SHOP_TABS = ['hunters', 'outfits', 'bolts'];
  const ITEM = {}; SHOP_TABS.forEach(t => CATALOG[t].items.forEach(it => { it.tab = t; ITEM[it.id] = it; }));
  const BOLT_FX = {
    oak: [0xb48cff, 0xffffff, 0x7a4fd1], silver: [0xcfd8dc, 0xffffff, 0x9aa7b0], fire: [0xff7a2a, 0xffd56b, 0xff4d2a],
    ice: [0x8fd8ff, 0xffffff, 0x5ec8ff], garlic: [0xfff4d6, 0xe8d9a0, 0xffffff], holy: [0x5ec8ff, 0xb8ecff, 0xffffff], sun: [0xffcf5a, 0xfff1c1, 0xffb547],
  };
  function ensureProfile(p) {
    p.coins = p.coins || 0;
    p.owned = p.owned || { rook: true, ivy: true, oak: true };
    p.look = p.look || 'rook';
    p.bolt = p.bolt || 'oak';
    p.ach = Object.assign({ bossKills: 0, bestWpm: 0, bestAcc: 0, capsCleared: {} }, p.ach || {});
    p.announced = p.announced || {};
    return p;
  }

  // ---------- Keyboard layout ----------
  // 0 pinky, 1 ring, 2 middle, 3 pointer
  const FINGER = {
    '1':0,'2':1,'3':2,'4':3,'5':3,'6':3,'7':3,'8':2,'9':1,'0':0,
    q:0,a:0,z:0,p:0,';':0,'/':0,
    w:1,s:1,x:1,o:1,l:1,'.':1,
    e:2,d:2,c:2,i:2,k:2,',':2,
    r:3,f:3,v:3,t:3,g:3,b:3,y:3,h:3,n:3,u:3,j:3,m:3
  };
  const LEFT_HAND = new Set('12345qwertasdfgzxcvb');
  const SHIFTED = { '!':'1','@':'2','#':'3','$':'4','%':'5','^':'6','&':'7','*':'8','(':'9',')':'0','?':'/',':':';','<':',','>':'.' };
  const physKey = c => SHIFTED[c] || c.toLowerCase();
  const needsShift = c => !!SHIFTED[c] || c !== c.toLowerCase();
  const CAPS_BONUS = 1.5;
  const PRACTICE_COLOR = '#5ec8ff', PRACTICE_EDGE = 0x5ec8ff;   // practice mode is always blue so it never looks like the real hunt
  const FINGER_COLORS = [0xff7eb3, 0xffb547, 0x7be08f, 0x5ec8ff];
  const FINGER_NAMES = ['Pinky', 'Ring', 'Middle', 'Pointer'];
  const KB_STEP = 37, KB_KEY = 31, KB_HOME_X = 473.5;
  const KB_ROWS = [
    { chars: '1234567890', y: 572, x0: KB_HOME_X - 27 },
    { chars: 'qwertyuiop', y: 606, x0: KB_HOME_X - 9 },
    { chars: 'asdfghjkl;', y: 640, x0: KB_HOME_X },
    { chars: 'zxcvbnm,./', y: 674, x0: KB_HOME_X + 18 },
  ];

  // ---------- Word lists ----------
  const HOME = 'asdfghjkl;';
  const H2 = ['as', 'ad', 'ha', 'la', 'ah', 'sh'];
  const H3 = ['ask', 'add', 'dad', 'sad', 'lad', 'had', 'has', 'gas', 'fad', 'lag', 'sag', 'all', 'ash', 'gal', 'aha'];
  const H4 = ['fall', 'hall', 'lash', 'dash', 'flag', 'glad', 'half', 'sash', 'alas', 'gala', 'dads', 'asks', 'lads', 'fads', 'sass'];
  const H5 = ['flash', 'salad', 'flask', 'glass', 'shall', 'falls', 'halls', 'flags', 'salsa', 'slash'];
  const TOPK = 'qwertyuiop';
  const T2 = ['we', 'it', 'to', 'up', 'or', 'oy'];
  const T3 = ['pet', 'wet', 'yet', 'tie', 'toe', 'rip', 'pot', 'put', 'out', 'our', 'you', 'toy', 'top', 'tip', 'pie', 'rot', 'tow'];
  const T4 = ['type', 'tree', 'pour', 'quit', 'wire', 'ripe', 'rope', 'poet', 'your', 'yeti', 'trip', 'were', 'pity', 'pure'];
  const T5 = ['tower', 'quiet', 'write', 'power', 'route', 'quote', 'equip', 'pretty', 'report', 'pottery', 'territory'];
  const TMIX = ['ghost', 'fright', 'skull', 'dusk', 'stake', 'fear', 'hood', 'stair', 'loot', 'gold', 'sword', 'shadow', 'lair', 'tooth', 'dagger'];
  const BOTK = 'zxcvbnm,./';
  const B2 = ['an', 'am', 'ax', 'ma', 'ban', 'cab'];
  const B3 = ['man', 'can', 'van', 'fan', 'ban', 'nab', 'cab', 'jab', 'lab', 'dab', 'mad', 'bad', 'ham', 'jam', 'max', 'zag', 'lax', 'tax'];
  const B4 = ['band', 'hand', 'land', 'sand', 'calm', 'cash', 'bash', 'mash', 'slam', 'clam', 'scan', 'jazz', 'lamb', 'balm', 'vans', 'snag'];
  const B5 = ['black', 'snack', 'small', 'flash', 'clash', 'smash', 'blank', 'zebra', 'magic', 'candle', 'fancy', 'vampire'];
  const A3 = ['bat', 'fog', 'owl', 'cat', 'web', 'sun', 'fly', 'run', 'hop', 'zap', 'sky', 'mud', 'jam', 'box', 'fox', 'key', 'map', 'pen', 'cup', 'hat'];
  const A4 = ['moon', 'fang', 'cape', 'bone', 'dark', 'glow', 'howl', 'mist', 'toad', 'wolf', 'tomb', 'crow', 'gate', 'bell', 'rope', 'hunt', 'jump', 'quiz', 'zoom', 'king'];
  const A5 = ['ghost', 'night', 'stake', 'spell', 'skull', 'witch', 'tower', 'broom', 'magic', 'crypt', 'shiny', 'brave', 'quick', 'smile', 'jelly', 'pizza', 'zebra', 'frost', 'candle'];
  const A6 = ['vampire', 'castle', 'garlic', 'shadow', 'hunter', 'coffin', 'spooky', 'goblin', 'pumpkin', 'lantern', 'monster', 'crossbow', 'midnight', 'mystery', 'thunder', 'dungeon', 'treasure', 'wizard', 'silver', 'gargoyle'];
  const ALPHA = 'abcdefghijklmnopqrstuvwxyz';
  const DIGITS = '1234567890';

  const L = (keys, newKeys, count, speed, gap, tip, extra = {}) => Object.assign({ keys, newKeys, mode: 'letters', count, speed, gap, tip }, extra);
  const Wd = (keys, words, count, speed, gap, tip, extra = {}) => Object.assign({ keys, words, mode: 'words', count, speed, gap, tip }, extra);

  // ---------- Typing modes ----------
  const MODES = {
    home: {
      name: 'Home Row', skipTo: 5, keysLabel: 'A S D F G H J K L ;',
      waves: [
        L('fj', 'fj', 8, 58, 2600, 'Pointer fingers go on F and J. Feel the little bumps? That is home.'),
        L('fjdk', 'dk', 10, 62, 2400, 'Middle fingers rest on D and K, right next to your pointers.'),
        L('fjdksl', 'sl', 12, 66, 2200, 'Ring fingers rest on S and L. Keep your eyes up here, not on your hands.'),
        L('fjdksla;', 'a;', 12, 70, 2100, 'Pinkies rest on A and ; (the semicolon). Every finger has a home now.'),
        L(HOME, 'gh', 14, 74, 1900, 'Stretch a pointer finger in for G or H, then slide it straight back home.', { boss: ['as', 'ha', 'la', 'dad'] }),
        Wd(HOME, H2, 12, 62, 2600, 'Some vampires carry short words now. Type every letter to load the bolt.', { mode: 'pairs' }),
        Wd(HOME, H3, 12, 56, 3000, 'Three-letter words. If you pick the wrong vampire, press Backspace to let go.'),
        Wd(HOME, H4, 12, 54, 3300, 'Four-letter words. Smooth and steady beats fast and sloppy.', { boss: ['alas', 'flask', 'salad', 'shall', 'glass'] }),
      ],
      endless: { keys: HOME, words: H4.concat(H5), speed: 56, gap: 3200 },
    },
    top: {
      name: 'Top Row', skipTo: 5, keysLabel: 'Q W E R T Y U I O P',

  // A mode's first waves teach its keys a pair at a time. Wave skipTo is the first one with every letter of
  // the row. Clearing it in a real hunt with MASTER_ACC accuracy or better counts as a clean clear, and after
  // MASTER_CLEARS of them new hunts start there instead of at wave 1. A rough round on it (under SLIP_ACC)
  // takes one clean clear back, so a hunter who gets rusty goes back to the warm-up. Practice never counts.
  const MASTER_ACC = 90, MASTER_CLEARS = 2, MASTER_CAP = 3, SLIP_ACC = 75;
  function warmupClears(p, modeKey) {
    const M = MODES[modeKey], prog = p.modes[modeKey] || {};
    if (!M.skipTo) return 0;
    if (prog.warmup !== undefined) return prog.warmup;
    return (prog.bestWave || 0) > M.skipTo ? MASTER_CLEARS : 0;   // saves from before this: already got past it
  }
  const warmupMastered = (p, modeKey) => !!MODES[modeKey].skipTo && warmupClears(p, modeKey) >= MASTER_CLEARS;
  const autoStartWave = (p, modeKey) => warmupMastered(p, modeKey) ? MODES[modeKey].skipTo : 1;

  const Sfx = {
    ctx: null, on: true,
    init() {

    tone(freq, dur, type = 'square', vol = 0.08, slideTo = null, delay = 0) {
      if (!this.on || !this.ctx) return;
      const t = this.ctx.currentTime + delay;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    },
    noise(dur, vol = 0.12, freq = 900) {
      if (!this.on || !this.ctx) return;
      const n = Math.floor(this.ctx.sampleRate * dur);
      const b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const s = this.ctx.createBufferSource(); s.buffer = b;
      const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq;
      const g = this.ctx.createGain(); g.gain.value = vol;
      s.connect(f).connect(g).connect(this.ctx.destination); s.start();
    },

        .then(buf => { this.buffers[name] = buf; if (this.wanted === name && this.curName !== name) this.start(name); })
        .catch(() => { /* music missing: the game still plays with sound effects */ })
        .finally(() => { delete this.loading[name]; });

    prefetch(name) { this.keep = name; this.load(name); },
    want(name) {

    start(name) {

        Object.keys(this.buffers).forEach(k => { if (this.tracks[k].lazy && k !== name && k !== this.keep) delete this.buffers[k]; });
      if (!this.on) { this.curName = null; return; }
      const t = this.tracks[name], src = this.ctx.createBufferSource(), g = this.ctx.createGain();
      src.buffer = buf; src.loop = !!t.loop;

    },
    stopCurrent() {
      if (!this.cur) return;

      try { g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(g.gain.value, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.4); src.stop(now + 0.45); } catch (e) {}

    },

      const now = this.ctx.currentTime;
      if (now < this.stingUntil) return true;   // one jingle at a time (boss defeat and wave clear can land together)
      const src = this.ctx.createBufferSource(), g = this.ctx.createGain();

      src.connect(g).connect(this.ctx.destination); src.start(now); src.stop(now + dur + 0.05);

      this.out.gain.cancelScheduledValues(now);
      this.out.gain.setValueAtTime(this.vol, now); this.out.gain.linearRampToValueAtTime(this.vol * 0.3, now + 0.2);

      this.on = !this.on;

  // ---------- Grown-ups page ----------
  // A plain web page over the game, opened from the hunter screen behind a 4-digit PIN. It answers three questions:
  // which facts are known, is the hunter getting faster, and how much did they practice. Everything comes from the
  // save on this device. Settings here are per hunter; the PIN is for the whole device.
  const Grownups = {
    el: null, scene: null, pid: null, sel: null, pinBuf: '', pinStep: null, pinFirst: '',
    open(scene) {
      this.scene = scene;
      this.el = this.el || document.getElementById('grownups');
      this.pid = Store.data.lastId || (Store.data.profiles[0] || {}).id;
      this.el.hidden = false;
      this.pinBuf = ''; this.pinFirst = '';
      this.pinStep = Store.data.pin ? 'enter' : 'new';
      this.drawPin('');
      if (!this.keyFn) {
        this.keyFn = e => {
          if (this.el.hidden) return;
          if (e.key === 'Escape') { e.preventDefault(); this.close(); return; }
          if (this.pinStep && /^[0-9]$/.test(e.key)) { e.preventDefault(); this.pinKey(e.key); }
          else if (this.pinStep && e.key === 'Backspace') { e.preventDefault(); this.pinKey('del'); }
        };
        window.addEventListener('keydown', this.keyFn);
      }
    },
    close() {
      this.el.hidden = true; this.el.innerHTML = ''; this.pinStep = null;
      Store.save();
      this.scene.showProfiles();
    },
    esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); },
    // --- the PIN ---
    drawPin(msg) {
      const title = { new: 'Set a 4-digit PIN for the grown-ups page', again: 'Type the same PIN again', enter: 'Grown-ups only: type the PIN', reset: 'To set a new PIN, answer 14 × 16' }[this.pinStep];
      const len = this.pinStep === 'reset' ? 3 : 4;
      const dots = Array.from({ length: len }, (_, i) => `<span class="gu-dot${i < this.pinBuf.length ? ' on' : ''}">${this.pinStep === 'reset' && this.pinBuf[i] ? this.pinBuf[i] : ''}</span>`).join('');
      const pad = [1, 2, 3, 4, 5, 6, 7, 8, 9, 'del', 0, 'ok'].map(k => k === 'ok' ? '<span></span>'
        : `<button class="gu-key" data-k="${k}">${k === 'del' ? '⌫' : k}</button>`).join('');
      this.el.innerHTML = `<div class="gu-pin"><h2>${title}</h2><div class="gu-dots">${dots}</div><p class="gu-msg">${this.esc(msg || '')}</p>
        <div class="gu-pad">${pad}</div>
        <p class="gu-small">${this.pinStep === 'enter' ? '<button class="gu-link" data-act="forgot">Forgot the PIN?</button>' : ''}
        <button class="gu-link" data-act="close">Back to the game (Esc)</button></p></div>`;
      this.el.querySelectorAll('.gu-key').forEach(b => b.onclick = () => this.pinKey(b.dataset.k));
      this.el.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
        if (b.dataset.act === 'close') this.close();
        else { this.pinStep = 'reset'; this.pinBuf = ''; this.drawPin(''); }
      });
    },
    pinKey(k) {
      const len = this.pinStep === 'reset' ? 3 : 4;
      if (k === 'del') this.pinBuf = this.pinBuf.slice(0, -1);
      else if (this.pinBuf.length < len) this.pinBuf += k;
      if (this.pinBuf.length < len) { this.drawPin(''); return; }
      const v = this.pinBuf; this.pinBuf = '';
      if (this.pinStep === 'new') { this.pinFirst = v; this.pinStep = 'again'; this.drawPin(''); }
      else if (this.pinStep === 'again') {
        if (v === this.pinFirst) { Store.data.pin = v; Store.save(); this.pinStep = null; this.render(); }
        else { this.pinStep = 'new'; this.drawPin('Those two did not match. Try again.'); }
      } else if (this.pinStep === 'reset') {
        if (v === '224') { this.pinStep = 'new'; this.drawPin(''); } else this.drawPin('Not quite. Try again.');
      } else if (v === Store.data.pin) { this.pinStep = null; this.render(); }
      else this.drawPin('That is not the PIN.');
    },
    // --- the page ---
    profile() { return Store.data.profiles.find(p => p.id === this.pid) || Store.data.profiles[0]; },
    dateKeys(n) { return Array.from({ length: n }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - i); return todayKey(d); }); },
    render() {

      const p = ensureProfile(this.profile()); this.pid = p.id;
      const m = MX.ensure(p);

      const last14 = this.dateKeys(14), goals = last14.filter(k => (m.days[k] || {}).goal).length;
      const tabs = ps.map(q => `<button class="gu-tab${q.id === p.id ? ' on' : ''}" data-pid="${q.id}">${this.esc(q.name)}</button>`).join('');
      this.el.innerHTML = `<div class="gu-page">

          <button class="gu-btn" data-act="copy">Copy report</button><button class="gu-btn" data-act="close">Close (Esc)</button></header>
        <p class="gu-copied" hidden>Report copied. Paste it into a message to the teacher.</p>
        <section class="gu-tiles">

          ${this.tile(`${fluent} of 55`, 'facts Fluent (within 3 s)')}
          ${this.tile(`${mastered} of 55`, 'facts Mastered (Fluent on 3 days)')}
          ${this.tile(`${dayStreak(p)}`, 'day streak of full daily hunts')}

        </section>
        <div class="gu-cols">
          <section class="gu-card"><h2>Which facts are known</h2>${this.grid(p)}<div class="gu-detail" id="gu-detail">${this.detail(p, this.sel)}</div></section>
          <section class="gu-card"><h2>Facts to watch</h2>${this.watch(p)}<h2 class="gu-h2b">Map progress</h2>${this.mapList(p)}</section>
        </div>
        <div class="gu-cols">
          <section class="gu-card"><h2>Getting faster</h2><p class="gu-note">Average answer time per table, by week, oldest on the left. Bars go up to 8 seconds; under the dashed 3-second line is Fluent. Hover a bar for its time.</p>${this.speed(p)}</section>

    wire() {
      const $ = s => this.el.querySelectorAll(s);

    tile(big, small) { return `<div class="gu-tile"><b>${big}</b><span>${small}</span></div>`; },
    hex(c) { return '#' + c.toString(16).padStart(6, '0'); },
    grid(p) {
      let h = '<div class="gu-grid" role="grid"><span></span>';
      for (let c = 1; c <= 10; c++) h += `<span class="gu-hd">${c}</span>`;
      for (let r = 1; r <= 10; r++) {
        h += `<span class="gu-hd">${r}</span>`;
        for (let c = 1; c <= 10; c++) {
          const k = MX.key(r, c), l = MX.level(p, k), L = MX.LEVELS[l];
          h += `<button class="gu-cell${this.sel === k ? ' sel' : ''}" data-k="${k}" style="background:${this.hex(L.color)}${l === 0 ? ';color:#e4d9fb' : ''}" title="${r} × ${c} = ${r * c}: ${L.name}">${r * c}</button>`;
        }
      }
      h += '</div><div class="gu-legend">' + MX.LEVELS.map(L => `<span><i style="background:${this.hex(L.color)}"></i>${L.name}</span>`).join('') + '</div>';
      return h + '<p class="gu-note">Each square is one fact; 7 × 8 and 8 × 7 are the same fact. Tap a square for details.</p>';
    },
    detail(p, k) {
      if (!k) return '<p class="gu-note">Tap a square to see how that fact is going.</p>';
      const f = MX.ensure(p).facts[k], [a, b] = MX.parse(k), today = MX.dayNum();
      if (!f || (!f.hit && !f.miss)) return `<p><b>${a} × ${b} = ${a * b}</b> · ${MX.LEVELS[f ? f.lvl : 0].name}. Not answered yet. Strategy: ${MX.hint(k)}.</p>`;
      const n = f.hit + f.miss, ago = today - f.last, due = f.due - today;
      return `<p><b>${a} × ${b} = ${a * b}</b> · ${MX.LEVELS[f.lvl].name}<br>Right ${f.hit} of ${n} (${Math.round(f.hit / n * 100)}%) · average ${f.hit ? (f.ms / f.hit / 1000).toFixed(1) + ' s' : '–'} · ` +
        `last seen ${ago <= 0 ? 'today' : ago === 1 ? 'yesterday' : ago + ' days ago'} · ${due <= 0 ? 'due for review now' : 'next review in ' + due + (due === 1 ? ' day' : ' days')}<br>Strategy: ${MX.hint(k)}</p>`;
    },
    watch(p) {
      const F = MX.ensure(p).facts, list = MX.weakFacts(p, 5);
      if (!list.length) return '<p class="gu-note">No tricky facts yet. Facts show up here after a few misses or slow answers.</p>';
      return '<ul class="gu-list">' + list.map(k => {
        const f = F[k], n = f.hit + f.miss, [a, b] = MX.parse(k);
        return `<li><b>${b} × ${a} = ${a * b}</b>: missed ${f.miss} of ${n}${f.hit ? `, average ${(f.ms / f.hit / 1000).toFixed(1)} s` : ''}.<br><span class="gu-tip">Try: ${MX.hint(k)}</span></li>`;
      }).join('') + '</ul>';
    },
    mapList(p) {
      const m = MX.ensure(p);

        return `<li class="${open ? '' : 'off'}"><span>${s.id}. ${s.name} <small>${s.label}</small></span><span>${state}${m.bosses[s.id] ? ' · boss beaten' : ''}</span></li>`;
      }).join('') + '</ul>';
    },
    // Small multiples: one tiny bar chart per table, four weekly bars each, with the 3-second Fluent line.
    speed(p) {
      const days = MX.ensure(p).days, keys = this.dateKeys(28), max = 8000, W = 76, H = 60;
      const any = keys.some(k => days[k] && days[k].t && Object.keys(days[k].t).length);
      if (!any) return '<p class="gu-note">No answers in the last 4 weeks yet.</p>';
      let out = '<div class="gu-speed">';
      for (let t = 1; t <= 10; t++) {
        const weeks = [3, 2, 1, 0].map(w => {
          let sum = 0, n = 0;
          keys.slice(w * 7, w * 7 + 7).forEach(k => { const s = days[k] && days[k].t && days[k].t[t]; if (s) { sum += s[0]; n += s[1]; } });
          return n ? sum / n : null;
        });
        const y3 = H - H * MX.FAST_MS / max;
        let svg = `<svg viewBox="0 0 ${W} ${H + 14}" width="${W}" height="${H + 14}" role="img" aria-label="Times ${t}">`;
        weeks.forEach((ms, i) => {
          const x = 4 + i * 18;
          if (ms == null) { svg += `<rect x="${x}" y="${H - 2}" width="12" height="2" fill="#4a3a70"><title>${['3 weeks ago', '2 weeks ago', 'Last week', 'This week'][i]}: no answers</title></rect>`; return; }
          const h = Math.max(3, H * Math.min(ms, max) / max);
          svg += `<path d="M${x},${H} v${-(h - 4)} q0,-4 4,-4 h4 q4,0 4,4 v${h - 4} z" fill="#2f86c8"><title>${['3 weeks ago', '2 weeks ago', 'Last week', 'This week'][i]}: ${(ms / 1000).toFixed(1)} s</title></path>`;
        });
        svg += `<line x1="0" x2="${W}" y1="${y3}" y2="${y3}" stroke="#cbbcec" stroke-width="1" stroke-dasharray="3 3"/><line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="#4a3a70"/>`;
        const last = weeks.filter(x => x != null).pop();
        svg += `<text x="${W / 2}" y="${H + 12}" text-anchor="middle" fill="#cbbcec" font-size="10">×${t}${last ? ' · ' + (last / 1000).toFixed(1) + 's' : ''}</text></svg>`;
        out += svg;
      }
      return out + '</div>';
    },
    // Minutes per day, typing and math stacked, with facts answered and the daily goal marked.
    log(p) {
      const keys = this.dateKeys(14).reverse(), md = MX.ensure(p).days, W = 440, H = 120, bw = 22, gap = (W - 14 * bw) / 13;
      const rows = keys.map(k => { const d = p.days[k] || {}, m = md[k] || {}; return { k, t: (d.ms || 0) / 60000, m: (d.mathMs || 0) / 60000, n: m.n || 0, goal: !!m.goal, done: !!d.done }; });
      const max = Math.max(20, ...rows.map(r => r.t + r.m));
      let svg = `<svg viewBox="0 0 ${W} ${H + 40}" width="100%" role="img" aria-label="Minutes played per day">`;
      [10, 20].forEach(v => { const y = H - H * v / max; svg += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="#2c2148"/><text x="${W}" y="${y - 3}" text-anchor="end" fill="#9a8bc2" font-size="10">${v} min</text>`; });
      rows.forEach((r, i) => {
        const x = i * (bw + gap), ht = H * r.t / max, hm = H * r.m / max;
        const tip = `${r.k}: typing ${r.t.toFixed(1)} min, math ${r.m.toFixed(1)} min, ${r.n} facts answered${r.goal ? ', math goal hit' : ''}${r.done ? ', daily hunt done' : ''}`;
        svg += `<g><title>${tip}</title><rect x="${x}" y="0" width="${bw}" height="${H + 30}" fill="transparent"/>`;
        if (ht > 0) svg += `<rect x="${x}" y="${H - ht}" width="${bw}" height="${Math.max(1, ht)}" rx="${hm > 0 ? 0 : 3}" fill="#c08518"/>`;
        if (hm > 0) svg += `<rect x="${x}" y="${H - ht - hm - (ht > 0 ? 2 : 0)}" width="${bw}" height="${Math.max(1, hm)}" rx="3" fill="#2f86c8"/>`;
        svg += `<text x="${x + bw / 2}" y="${H + 13}" text-anchor="middle" fill="#cbbcec" font-size="10">${Number(r.k.slice(8))}</text>`;
        if (r.goal || r.done) svg += `<text x="${x + bw / 2}" y="${H + 27}" text-anchor="middle" fill="#ffcf5a" font-size="11">${r.done ? '✓' : ''}${r.goal ? '★' : ''}</text>`;
        svg += '</g>';
      });
      svg += `<line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="#4a3a70"/></svg>`;
      const facts = rows.reduce((a, r) => a + r.n, 0);
      return svg + `<div class="gu-legend"><span><i style="background:#c08518"></i>Typing minutes</span><span><i style="background:#2f86c8"></i>Math minutes</span><span>✓ daily hunt done</span><span>★ math goal</span></div>
        <p class="gu-note">${facts} facts answered in the last 14 days. A full daily hunt is 10 minutes of typing plus 10 of math. Day numbers along the bottom.</p>`;
    },
    // The key heat map: each key colored by how often it is missed. Grey keys have too few presses to tell.
    typing(p) {
      const ks = p.keyStats || {}, rows = ['1234567890', 'qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
      const cls = k => { const s = ks[k]; if (!s || s.hit + s.miss < 8) return ['none', 'Not enough presses yet'];
        const acc = s.hit / (s.hit + s.miss);
        return acc >= 0.95 ? ['good', `${Math.round(acc * 100)}% right`] : acc >= 0.85 ? ['mid', `${Math.round(acc * 100)}% right`] : ['bad', `${Math.round(acc * 100)}% right`]; };
      const kb = rows.map((r, i) => `<div class="gu-kbrow" style="padding-left:${i * 14}px">` + [...r].map(k => { const [c, t] = cls(k); return `<span class="gu-k ${c}" title="${k.toUpperCase()}: ${t}">${k.toUpperCase()}</span>`; }).join('') + '</div>').join('');
      const modes = MODE_ORDER.map(k => { const g = p.modes[k] || {}, c = g.caps || {};
        const best = [g.bestWave && 'best wave ' + g.bestWave, c.bestWave && 'with Capitals ' + c.bestWave].filter(Boolean).join(' · ');
        return `<li><span>${MODES[k].name}</span><span>${best || 'not tried yet'}</span></li>`; }).join('');
      return `<div class="gu-kb">${kb}</div><div class="gu-legend"><span><i class="good"></i>95%+ right</span><span><i class="mid"></i>85 to 95%</span><span><i class="bad"></i>under 85%</span><span><i class="none"></i>too few presses</span></div>
        <p>Best speed: <b>${p.ach.bestWpm} words per minute</b> · best accuracy: <b>${p.ach.bestAcc}%</b> · tricky keys: <b>${this.scene.weakKeysFor(p, 4).map(k => k.toUpperCase()).join(' ') || 'none yet'}</b></p>
        <ul class="gu-map">${modes}</ul>`;
    },
    settings(m) {
      const s = m.settings, opt = (vals, cur, fmt) => vals.map(v => `<option value="${v}"${Number(cur) === v ? ' selected' : ''}>${fmt(v)}</option>`).join('');
      return `<label>Daily math goal <select data-set="goal">${opt([30, 45, 60, 80, 100], s.goal, v => v + ' right answers')}</select></label>
        <label>Most math minutes in a day <select data-set="cap">${opt([0, 10, 15, 20, 30], s.cap, v => v ? v + ' minutes' : 'No limit')}</select></label>
        <label>How fast enemies walk in Math Hunt <select data-set="pace">${opt([0.8, 1, 1.2], s.pace, v => v === 1 ? 'Normal' : v < 1 ? 'Slower' : 'Faster')}</select></label>
        <label class="gu-check"><input type="checkbox" data-set="hints"${s.hints ? ' checked' : ''}> Show a hint picture on a fact missed twice in a hunt</label>
        <p class="gu-note">The order of the tables follows what most schools use: ×1, ×10, ×2, ×5, ×4, ×3, ×9, ×6, ×7, ×8. Changes save right away.</p>
        <button class="gu-btn" data-act="pin">Change the PIN</button>`;
    },
    report(p) {
      const m = MX.ensure(p), lv = MX.ALL_FACTS.map(k => MX.level(p, k)), F = m.facts;
      const known = lv.filter(l => l >= 2).length, fluent = lv.filter(l => l >= 3).length, mastered = lv.filter(l => l === 4).length;
      const keys = this.dateKeys(14), mins = keys.reduce((a, k) => a + ((p.days[k] || {}).mathMs || 0), 0) / 60000;
      const facts = keys.reduce((a, k) => a + ((m.days[k] || {}).n || 0), 0);
      const weak = MX.weakFacts(p, 5).map(k => { const [a, b] = MX.parse(k); return `${b} × ${a} (missed ${F[k].miss} of ${F[k].hit + F[k].miss})`; });
      const stages = MX.STAGES.filter(s => s.id <= m.open).map(s => `${s.name} ${s.label}: ${MX.progress(p, s.id).known}/${MX.progress(p, s.id).total}${m.mastered[s.id] ? ' (mastered)' : ''}`);
      return `${p.name}'s times tables (TypeSlayer Math Hunt), ${todayKey()}\n` +
        `Known ${known} of 55 facts, Fluent (under 3 seconds) ${fluent}, Mastered ${mastered}.\n` +
        `Last 14 days: ${Math.round(mins)} minutes of math, ${facts} facts answered.\n` +
        `Places: ${stages.join('; ')}.\n` +
        (weak.length ? `Facts to practice: ${weak.join(', ')}.\n` : '') +
        `Typing: best ${p.ach.bestWpm} words per minute, best accuracy ${p.ach.bestAcc}%.`;
    },
    copy() {
      const text = this.report(this.profile()), note = this.el.querySelector('.gu-copied');
      const done = () => { note.hidden = false; setTimeout(() => { note.hidden = true; }, 4000); };
      const fallback = () => {
        const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { /* the text stays selected for a manual copy */ }
        ta.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
    },
  };

  class Hunt extends Phaser.Scene {
    constructor() { super('hunt'); }

    preload() {
      Object.entries(SHEETS).forEach(([k, s]) => s.image ? this.load.image(k, s.url) : this.load.spritesheet(k, s.url, { frameWidth: s.size, frameHeight: s.size }));
    }

    create() {
      Store.load();
      makeTextures(this);
      Object.keys(SHEETS).forEach(k => this.textures.get(k).setFilter(Phaser.Textures.FilterMode.NEAREST));
      const A = (key, sheet, start, end, frameRate, extra = {}) =>
        this.anims.create(Object.assign({ key, frames: this.anims.generateFrameNumbers(sheet, { start, end }), frameRate }, extra));
      Object.entries(LOOKS).forEach(([id, L]) => {
        if (!hasLook(id)) return;
        const all = k => this.anims.generateFrameNumbers(k);
        this.anims.create({ key: id + '-idle', frames: all(L.idle), frameRate: 6, repeat: -1, yoyo: true });
        this.anims.create({ key: id + '-shoot', frames: all(L.shoot).slice(L.shootStart || 0), frameRate: 16 });
        this.anims.create({ key: id + '-hurt', frames: all(L.hurt), frameRate: 12 });
      });
      A('v-walk', 'vampWalk', 1, 8, 10, { repeat: -1 });

      A('a-walk', 'armoredWalk', 1, 8, 8, { repeat: -1 });

      A('c-walk', 'countWalk', 1, 8, 8, { repeat: -1 });
      A('c-cast', 'countCast', 0, 8, 10);

        A(`${id}-${anim}`, a.sheet, loop ? 1 : 0, a.frames - 1, loop ? (T && T.fps) || 8 : 10, loop ? { repeat: -1 } : {});
      }));

      this.drawBackground();

    // ---------- Scenery ----------
    drawBackground() {
      this.sceneObjs = []; this.sceneId = null;

      [430, 480, 530].forEach((y, i) => {
        const f = this.add.image(Phaser.Math.Between(0, W), y, 'fog').setScale(1.8, 1.1).setAlpha(0.55).setDepth(1200);
        const drift = () => {
          this.tweens.add({ targets: f, x: -450, duration: (f.x + 450) / (14 + i * 4) * 1000,
            onComplete: () => { f.x = W + 450; drift(); } });

        drift();
      });

      p.fillStyle(0x100a1f, 0.97); p.fillRect(0, 552, W, H - 552);
      p.lineStyle(2, 0x3d2b63, 1); p.lineBetween(0, 553, W, 553);

    setScene(id) {

      for (let i = 0; i < 140; i++) {
        g.fillStyle(S.tuft[i % S.tuft.length], 1);
        const x = Math.floor(Phaser.Math.Between(0, W) / 4) * 4, y = Math.floor(Phaser.Math.Between(436, 548) / 4) * 4;
        g.fillRect(x, y, 4 * Phaser.Math.Between(1, 3), 4);
      }
      objs.push(img, g);
      for (let i = 0; i < 12; i++) {
        const st = this.add.image(Phaser.Math.Between(20, W - 260), Phaser.Math.Between(10, 200), 'spark')
          .setScale(Phaser.Math.FloatBetween(0.2, 0.4)).setDepth(-90).setTint(S.sky ? 0xffffff : 0xffb070);

    // Fade the play area to night-black, swap the setting, and have the hunter hop back in from the left.

        this.tweens.add({ targets: this.hunter, y: HUNTER_Y - 14, duration: 125, yoyo: true, repeat: 2, onComplete: () => { this.hunter.y = HUNTER_Y; } });

    setHudVisible(v) {
      [this.waveText, this.statsText, this.scoreText, this.streakText, this.sessionText, this.jamLabel, this.jamGfx, this.jamNote, ...this.heartIcons].forEach(o => o.setVisible(v));
      [this.sessionBar, this.coinIcon, this.coinText, this.mutLabel, this.mutGfx].forEach(o => o.setVisible(v && !this.practice));   // practice earns nothing, so no coins or hunt bar
      if (!v) { this.jamText.setVisible(false); this.jamBar.clear(); }
    }
    drawMeters() {
      const g = this.jamGfx; g.clear();
      const jammed = this.jamLeft > 0, math = this.modeKey === 'math', jn = math ? MATH_JAM : JAM_AFTER;
      for (let i = 0; i < jn; i++) {
        const x = 104 + i * 22, on = jammed || i < this.wrongRun;
        g.fillStyle(on ? 0xff5a5a : 0x2c2148, 1); g.fillCircle(x, 140, 7);
        g.lineStyle(2, on ? 0xffb0b0 : 0x4a3a70, 1); g.strokeCircle(x, 140, 7);
      }
      this.jamLabel.setColor(jammed ? '#ff7b7b' : '#e4d9fb');
      this.jamNote.setText(jammed ? `JAMMED  ${(this.jamLeft / 1000).toFixed(1)}s` : this.practice ? 'Practice: no jams' : `${jn} ${math ? 'wrong answers' : 'misses'} in a row jam it`)
        .setColor(jammed ? '#ff7b7b' : '#9a8bc2');
      if (this.practice) return;
      const m = this.mutGfx; m.clear();
      if (math && (this.waveWrong >= 3 || this.mutantDue)) {   // misses piling up: the math Mutant meter
        const f = Math.min(1, this.waveWrong / MATH_MUTANT);
        m.fillStyle(0x2c2148, 1); m.fillRoundedRect(20, 180, 200, 8, 4);
        m.fillStyle(this.mutantDue ? 0x9be15d : f > 0.6 ? 0xff5a5a : 0xffb547, 1); m.fillRoundedRect(20, 180, Math.max(8, 200 * f), 8, 4);
        this.mutLabel.setText(this.mutantDue ? (this.mutantSpawned ? 'Beat the Mega Mutant!' : 'Mega Mutant is coming!') : `Misses this wave  ${this.waveWrong} / ${MATH_MUTANT}`)
          .setColor(this.mutantDue ? '#9be15d' : '#ff9b9b');
        return;
      }
      if (math) {   // Math Hunt shows the daily goal here instead of the Mutant meter
        const right = this.mathToday().right, f = Math.min(1, right / MX.goal(this.profile)), done = right >= MX.goal(this.profile);
        m.fillStyle(0x2c2148, 1); m.fillRoundedRect(20, 180, 200, 8, 4);
        if (f > 0) { m.fillStyle(done ? 0x7be08f : 0x5ec8ff, 1); m.fillRoundedRect(20, 180, Math.max(8, 200 * f), 8, 4); }
        this.mutLabel.setText(done ? `Daily math goal done!  ${right} facts` : `Daily math goal  ${right} / ${MX.goal(this.profile)} facts`).setColor(done ? '#7be08f' : '#e4d9fb');
        return;
      }
      const f = Math.min(1, this.waveWrong / MUTANT_AFTER);
      m.fillStyle(0x2c2148, 1); m.fillRoundedRect(20, 180, 200, 8, 4);
      if (f > 0) { m.fillStyle(this.mutantDue ? 0x9be15d : f > 0.66 ? 0xff5a5a : f > 0.33 ? 0xffb547 : 0xffcf5a, 1); m.fillRoundedRect(20, 180, Math.max(8, 200 * f), 8, 4); }
      this.mutLabel.setText(this.mutantDue ? (this.mutantSpawned ? 'Beat the Mega Mutant!' : 'Mega Mutant is coming!') : `Wrong keys this wave  ${this.waveWrong} / ${MUTANT_AFTER}`)
        .setColor(this.mutantDue ? '#9be15d' : f > 0.66 ? '#ff9b9b' : '#e4d9fb');
    }
    updateHearts() {
      this.heartIcons.forEach((h, i) => h.setTexture(i < this.hearts ? 'heart' : 'heartEmpty'));
    }
    mult() { return 1 + Math.min(3, Math.floor(this.streak / 10)); }
    accuracy() { const t = this.correct + this.wrong; return t ? Math.round(this.correct / t * 100) : 100; }
    wpm() { return this.activeMs > 4000 ? Math.round((this.correct / 5) / (this.activeMs / 60000)) : 0; }
    updateHud() {
      this.drawMeters();
      if (this.modeKey === 'math') {
        const st = this.mh.stats, kind = this.mathKind(this.wave);
        const acc = st.n ? Math.round(st.right / st.n * 100) : 100, avg = st.right ? (st.ms / st.right / 1000).toFixed(1) + 's' : '-';
        this.waveText.setText(`${['bonus', 'mixed', 'practice'].includes(kind) ? 'Math Hunt' : MX.stage(this.mh.stage).name}  ·  Wave ${this.wave}: ${MATH_WAVES[kind].name}`);
        this.statsText.setText(`Right first try ${acc}%   ·   Average ${avg}   ·   Pace ${this.pace.toFixed(1)}×`);
      } else this.waveText.setText(`${this.practice ? 'Practice  ·  ' : ''}${MODES[this.modeKey].name}  ·  Wave ${this.wave}`);
      if (this.modeKey !== 'math') this.statsText.setText(`Accuracy ${this.accuracy()}%   ·   Speed ${this.wpm()} WPM   ·   Pace ${this.pace.toFixed(1)}×${this.caps && !this.practice ? '   ·   Capitals ×1.5' : ''}`);
      if (this.practice) {
        this.scoreText.setText('PRACTICE').setColor(PRACTICE_COLOR);
        this.streakText.setText(this.streak ? `Streak ${this.streak}` : '');
        this.sessionText.setText('Practice: no points or coins').setColor(PRACTICE_COLOR);
        return;
      }
      this.scoreText.setText(this.score.toLocaleString()).setColor('#f4ecff');
      this.sessionText.setColor('#e4d9fb');
      const m = this.mult();
      this.streakText.setText(this.streak ? `Streak ${this.streak}${m > 1 ? '   ×' + m : ''}` : '');
      this.drawSession();
      this.coinText.setText(`${this.profile.coins.toLocaleString()}`);
    }
    drawSession() {
      const p = this.profile; if (!p) return;
      const math = this.modeKey === 'math', ms = todayMs(p, math), done = (p.days[todayKey()] || {}).done;
      const name = math ? 'Math time' : 'Typing time';
      this.sessionText.setText(done ? 'Daily hunt done!' : ms >= PART_MS ? `${name} done! ✓` : `${name}  ${fmtMin(ms)} / 10:00`);
      // two short bars: typing (gold) and math (blue), each full at 10 minutes
      const g = this.sessionBar; g.clear();
      [todayMs(p), todayMs(p, true)].forEach((t, i) => {
        const x = 20 + i * 102;
        g.fillStyle(0x2c2148, 1); g.fillRoundedRect(x, 80, 98, 8, 4);
        g.fillStyle(t >= PART_MS ? 0x7be08f : i ? 0x5ec8ff : 0xffcf5a, (i === 1) === math ? 1 : 0.55);
        g.fillRoundedRect(x, 80, Math.max(8, 98 * Math.min(1, t / PART_MS)), 8, 4);
      });
    }

    // ---------- On-screen keyboard ----------
    buildKeyboard() {
      this.keyPos = {}; this.keyGfx = {}; this.keyTxt = {};
      this.kbObjs = [];
      const K = o => { this.kbObjs.push(o); return o; };
      KB_ROWS.forEach(row => {
        [...row.chars].forEach((ch, i) => {
          const x = row.x0 + i * KB_STEP, y = row.y;
          this.keyPos[ch] = { x, y };
          this.keyGfx[ch] = K(this.add.graphics().setDepth(2001));
          this.keyTxt[ch] = K(this.txt(x, y - 1, ch.toUpperCase(), { fontSize: '16px', fontStyle: '600' }).setOrigin(0.5).setDepth(2003));
        });
      });
      const bottom = KB_ROWS[3];
      this.shiftPos = {
        left:  { x: bottom.x0 - KB_STEP / 2 - 36, y: bottom.y },
        right: { x: bottom.x0 + 9 * KB_STEP + KB_STEP / 2 + 36, y: bottom.y },
      };
      this.shiftGfx = K(this.add.graphics().setDepth(2001));
      this.shiftTxt = ['left', 'right'].map(s => K(this.txt(this.shiftPos[s].x, this.shiftPos[s].y, 'SHIFT', { fontSize: '11px', fontStyle: '600' }).setOrigin(0.5).setDepth(2003)));
      this.spaceGfx = K(this.add.graphics().setDepth(2001));
      this.spaceTxt = K(this.txt(640, 703, 'SPACE', { fontSize: '11px', fontStyle: '600' }).setOrigin(0.5).setDepth(2003));
      this.keyGlow = this.add.image(0, 0, 'keyglow').setTint(0xffcf5a).setDepth(2002).setVisible(false);
      this.shiftGlow = this.add.image(0, 0, 'shiftglow').setTint(0xffcf5a).setDepth(2002).setVisible(false);
      this.tweens.add({ targets: [this.keyGlow, this.shiftGlow], alpha: { from: 1, to: 0.4 }, duration: 420, yoyo: true, repeat: -1 });
      this.nextKey = null;

      K(this.txt(36, 570, 'FINGER COLORS', { fontSize: '13px', fontStyle: '600', color: '#9a8bc2' }).setLetterSpacing(1.5).setDepth(2003));
      FINGER_NAMES.forEach((name, i) => {

        .setOrigin(0, 0.15).setDepth(2003));

      cg.lineStyle(2, 0x3d2b63, 1); cg.strokeRoundedRect(24, 562, 902, 148, 16);
      this.kbCover = [cg,
        this.txt(475, 592, 'Eyes on the vampires!', { fontFamily: TITLE_FONT, fontSize: '32px', color: '#ffcf5a', stroke: '#3b1a5a', strokeThickness: 5 }).setOrigin(0.5).setDepth(2003),
        this.txt(475, 632, 'The keyboard is covered so your fingers learn where the keys are.\nRest on the home row and feel for the little bumps on F and J.',
          { fontSize: '17px', fontStyle: '500', color: '#e4d9fb', align: 'center', lineSpacing: 4 }).setOrigin(0.5, 0.25).setDepth(2003),
        this.txt(475, 690, 'Need to see the keys? Press P on the hunt menu for Practice mode (it does not earn points or coins).',
          { fontSize: '14px', fontStyle: '600', color: '#5ec8ff' }).setOrigin(0.5).setDepth(2003),

    // The cover's words: typing tips, or number-key tips in the Math Hunt.
    coverText(math) {
      const [, t, b, f] = this.kbCover;
      t.setText(math ? 'Eyes on the problems!' : 'Eyes on the vampires!');
      b.setText(math ? 'Answers use the number keys along the top row of the keyboard.\nTry to find them by feel, without looking down.'
        : 'The keyboard is covered so your fingers learn where the keys are.\nRest on the home row and feel for the little bumps on F and J.');
      f.setText(math ? 'Stuck on a fact? Press SPACE to see the answer, then type it. Quick answers make facts Fluent.'
        : 'Need to see the keys? Press P on the hunt menu for Practice mode (it does not earn points or coins).');

    // The on-screen keyboard is only shown in practice mode. Everywhere else it is covered up.
    showKeyboard(on) {
      this.kbShown = on;
      this.kbObjs.forEach(o => o.setVisible(on));
      this.kbCover.forEach(o => o.setVisible(!on));
      if (!on) this.hideGlow();
    }
    drawKey(ch, state) {
      const { x, y } = this.keyPos[ch], g = this.keyGfx[ch], s = KB_KEY;
      const col = FINGER_COLORS[FINGER[ch]];
      g.clear();
      if (state === 'off') {
        g.fillStyle(0x1d1533, 1); g.fillRoundedRect(x - s / 2, y - s / 2, s, s, 6);
        g.lineStyle(2, 0x2c2148, 1); g.strokeRoundedRect(x - s / 2, y - s / 2, s, s, 6);
        this.keyTxt[ch].setColor('#5b4f78');
      } else {
        g.fillStyle(col, state === 'new' ? 0.55 : 0.25); g.fillRoundedRect(x - s / 2, y - s / 2, s, s, 6);
        g.lineStyle(2, col, 1); g.strokeRoundedRect(x - s / 2, y - s / 2, s, s, 6);
        this.keyTxt[ch].setColor('#ffffff');
      }
      if (ch === 'f' || ch === 'j') {
        g.fillStyle(state === 'off' ? 0x5b4f78 : 0xffffff, 1); g.fillRoundedRect(x - 5, y + 9, 10, 3, 1.5);
      }
    }
    refreshKeyboard(keys, newKeys = '') {
      const on = new Set([...keys].map(physKey)), fresh = new Set([...newKeys].map(physKey));
      Object.keys(this.keyPos).forEach(ch => this.drawKey(ch, fresh.has(ch) ? 'new' : on.has(ch) ? 'on' : 'off'));
      this.drawShift([...keys].some(c => SHIFTED[c]));
    }
    drawShift(lit) {
      const g = this.shiftGfx; g.clear();
      Object.values(this.shiftPos).forEach(({ x, y }) => {
        g.fillStyle(lit ? 0xff7eb3 : 0x1d1533, lit ? 0.25 : 1); g.fillRoundedRect(x - 32, y - KB_KEY / 2, 64, KB_KEY, 6);
        g.lineStyle(2, lit ? 0xff7eb3 : 0x2c2148, 1); g.strokeRoundedRect(x - 32, y - KB_KEY / 2, 64, KB_KEY, 6);
      });

          if (alive.length) c = alive.reduce((a, b) => (a.x < b.x ? a : b)).word[0];

        it.fact = this.txt(cx, top + 200, `${it.a} × ${it.b} = ${it.ans}`, { fontSize: '34px', fontStyle: '700', color: '#ffffff' }).setOrigin(0.5);
        it.prompt = this.txt(cx, top + 242, '', { fontSize: '22px', fontStyle: '700', color: '#ffcf5a' }).setOrigin(0.5);

    drawLessonCard() {
      const C = this.mh.card;

        else if (i === C.i) it.prompt.setText(`Type ${it.ans}:  ${it.buf || ''}_`).setColor('#ffcf5a');
        else it.prompt.setText('Next').setColor('#5b4f78');

    }
    cardKey(k) {

    finishLessonCard() {

    // A fact on an enemy. ans is what gets typed (the product, or the hidden number on a ghost), prod is the product.
    makeFact(k) {

    factText(f) { return f.missing ? `${f.a} × ${f.b} = ${f.prod}` : `${f.a} × ${f.b} = ${f.ans}`; }

    mathFact(kind) {

      const avoid = new Set(this.vamps.filter(v => !v.dead && v.fact).map(v => v.fact.key));
      let k = null;

      if (r >= 0) k = mh.retry.splice(r, 1)[0].key;

    // Each enemy has a math job. Slow mummies carry facts still being learned, fast wolf pups carry fluent ones,

    // and a ghost hides one of the numbers (? × 6 = 42).
    mathJob(fact) {
      const kind = this.cfg.kind, lvl = MX.level(this.profile, fact.key), rule = MX.isRule(fact.key);
      const has = t => TYPES[t] && this.textures.exists(TYPES[t].sheet);
      if (!['scout', 'practice', 'warmup'].includes(kind)) {
        if (lvl >= 3 && !rule && has('ghost') && Math.random() < 0.18) {

          return { type: 'ghost' };
        }
        if (lvl >= 2 && fact.a !== fact.b && has('shield') && Math.random() < 0.15) {
          return { type: 'shield', queue: [{ key: fact.key, a: fact.b, b: fact.a, ans: fact.prod, prod: fact.prod, extra: true }] };
        }
      }
      const inStage = MX.stage(this.mh.stage).pool.includes(fact.key);
      const opts = kind === 'scout' ? [['fledgling', 3], ['armored', 1]]
        : kind === 'practice' ? [['fledgling', 3], ['mummy', 1]]
        : lvl <= 1 ? [['mummy', 3], ['fledgling', 1]]
        : lvl === 2 ? [['fledgling', 3], ['armored', inStage && !rule ? 2.5 : 0.5], ['ghoul', 1]]
        : [['wolf', 2], ['ghoul', 1], ['fledgling', 1]];
      const ok = opts.filter(([t]) => has(t));
      return { type: ok.length ? this.weighted(ok, o => o[1])[0] : 'fledgling' };
    }
    setFact(v, f) {
      Object.assign(v, { fact: f, word: String(f.ans), display: String(f.ans), buf: '', typed: 0, tried: false, revealed: false, reveal: false, aimAt: this.time.now });
      this.redrawLabel(v);
    }
    // A picture hint over the problem: the fact as rows of dots, with a strategy under it. Practice shows it on every
    // enemy; in a hunt it shows on a fact missed twice (grown-ups can turn that off).
    wantHint(v) {
      if (!v.fact || v.boss || this.modeKey !== 'math' || !this.mh) return false;
      return this.practice || (MX.ensure(this.profile).settings.hints && (this.mh.misses[v.fact.key] || 0) >= 2);
    }
    drawHint(v) {
      const want = this.wantHint(v) ? `${v.fact.a}x${v.fact.b}${v.fact.missing ? '?' : ''}` : null;
      if (v.hintKey === want) return;
      if (v.hint) { v.hint.destroy(); v.hint = null; }
      v.hintKey = want;
      if (!want) return;
      const f = v.fact, rows = Math.min(f.a, f.b), cols = Math.max(f.a, f.b), step = 8;
      const cap = this.txt(0, -6, MX.hint(f.key), { fontSize: '14px', fontStyle: '600', color: '#ffcf5a' }).setOrigin(0.5, 1);
      const gw = cols * step, gh = rows * step, bw = Math.max(gw, cap.width) + 18, bh = gh + 34;
      const g = this.add.graphics();
      g.fillStyle(0x140c28, 0.88); g.fillRoundedRect(-bw / 2, -bh, bw, bh, 8);
      g.lineStyle(2, 0x5ec8ff, 0.9); g.strokeRoundedRect(-bw / 2, -bh, bw, bh, 8);
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        g.fillStyle(FINGER_COLORS[r % FINGER_COLORS.length], 1);
        g.fillCircle(-gw / 2 + step / 2 + c * step, -bh + 8 + step / 2 + r * step, step * 0.34);
      }
      v.hint = this.add.container(0, -32, [g, cap]);
      v.label.add(v.hint);
    }
    // The crossbow always aims at the enemy closest to the hunter. It stays on one Titus has started typing.
    mathAim() {
      const cur = this.target && !this.target.dead && !this.target.removed ? this.target : null;
      if (cur && cur.buf) return cur;
      const alive = this.vamps.filter(v => !v.dead && v.fact);
      const v = alive.length ? alive.reduce((a, b) => (a.x < b.x ? a : b)) : null;
      if (v !== this.target) {
        const old = this.target; this.target = v;
        if (old && !old.removed) { old.buf = ''; this.redrawLabel(old); }
        if (v) { v.aimAt = this.time.now; this.redrawLabel(v); }
      }
      return v;
    }
    mathKey(k) {
      const now = this.time.now;
      this.vamps.forEach(a => a.pendingWord && this.nextBossWord(a));   // answering on before the bolt lands
      const digit = /^[0-9]$/.test(k);
      if (this.jamLeft > 0) { if (digit) Sfx.clunk(); return; }
      const v = this.mathAim();
      if (!v || now < (v.revealUntil || 0)) return;
      if (k === 'Backspace') { v.buf = v.buf.slice(0, -1); this.redrawLabel(v); return; }
      if (k === ' ' || k === 'Enter') {   // "I don't know": show the answer, then type it
        if (!v.tried) this.mathAnswer(v, false, 0);
        this.streak = 0;
        this.revealFact(v);
        return;
      }
      if (!digit || v.buf.length >= 4) return;
      v.buf += k;
      const ans = String(v.fact.ans);
      if (v.buf === ans) {
        const rt = Math.min(10000, now - (v.aimAt || now));
        v.lastFast = !v.revealed && rt <= MX.FAST_MS;
        if (!v.tried) this.mathAnswer(v, true, rt);
        this.streak++; this.bestStreak = Math.max(this.bestStreak, this.streak); this.wrongRun = 0;
        v.buf = ''; this.target = null;
        this.redrawLabel(v);
        this.shoot(v);
      } else if (v.buf.length >= ans.length) {
        if (!v.tried) this.mathAnswer(v, false, 0);
        this.streak = 0; this.wrongRun++;
        Sfx.miss();
        v.shakeUntil = now + 220;
        this.revealFact(v);
        if (this.wrongRun >= MATH_JAM && this.cfg.kind !== 'scout' && !this.practice) this.jam();
      } else { Sfx.key(); this.redrawLabel(v); }
    }
    // Shows the right answer on the enemy for a second. Then it is typed again, which doesn't count either way.
    revealFact(v) {
      v.revealed = true; v.reveal = true; v.buf = '';
      v.revealUntil = this.time.now + 1000;
      this.redrawLabel(v);

    }
    // Records the first answer to an enemy's fact. Typing it again after a miss never counts, and neither does the
    // turnaround behind a shield or anything in practice.
    mathAnswer(v, ok, rt) {
      if (v.tried) return;
      v.tried = true;

      if (v.fact.extra) return;

      }
      if (v.fact.missing) rt = Math.round(rt / 1.5);   // a hidden number takes a little longer to think through
      const f = MX.fact(p, k);
      if (!(k in mh.start)) mh.start[k] = f.lvl;
      const { before, after } = MX.record(f, ok, rt, MX.dayNum(), scout);
      MX.logDay(p, todayKey(), k, ok, rt);
      mh.stats.n++; mh.wave.n++;

        mh.stats.right++; mh.wave.right++; mh.stats.ms += rt; if (rt <= MX.FAST_MS) mh.stats.fast++;

      } else {
        this.wrong++; mh.misses[k] = (mh.misses[k] || 0) + 1;

          mh.retry.push({ key: k, at: this.spawned + 2 });
          mh.waveMissed.push(k); this.waveWrong++;

          if (!this.mutantDue && this.waveWrong >= MATH_MUTANT && TYPES.mutant && !v.T.mutant) {
            this.mutantDue = true;
            this.time.delayedCall(900, () => {
              if (this.state !== 'playing' || this.mutantSpawned) return;

      if (!scout) {
        MX.updateOpen(p).forEach(s => {
          mh.opened.push(s);
          this.time.delayedCall(700, () => { this.banner(`The ${s.name} is open!`, 260); if (!Music.sting('reward-unlocked')) Sfx.big(); });
        });
        MX.updateMastery(p).forEach(s => {
          mh.stamped = (mh.stamped || []).concat(s);
          this.time.delayedCall(1100, () => { this.banner(`${s.name} Mastered!`, 260, 'A gold stamp for the map!'); if (!Music.sting('table-mastered')) Sfx.big(); });
        });
      }
    }
    mathGoal() {
      const d = this.mathToday();
      if (d.goal || d.right < MX.goal(this.profile)) return;
      d.goal = true;
      this.addCoins(50);
      this.banner('Daily math goal!', 150);

      this.saveProfile();
    }
    // Four misses in a row in the scouting round: that's enough to know where to start.

    }
    mathWaveNote() {
      const mh = this.mh, w = mh.wave;

        mh.stage = MX.smartStage(this.profile);

          (opened.length ? `\nOpened: ${opened.map(s => `the ${s.name}`).join(' and ')}.` : '');

      this.state = 'mathdone';

      if (!Music.sting('reward-unlocked')) Sfx.big();

    }

    // ---------- Learning: per-key stats for this hunter ----------
    keyStat(k) {
      if (this.practice) return { hit: 0, miss: 0, ms: 0 };   // practice with the keyboard showing doesn't change a hunter's key stats

        .filter(([, s]) => s.hit + s.miss >= 5)
        .map(([k]) => [k, this.keyWeight(k)])
        .filter(([, w]) => w > 1.5)

    }
    weighted(items, wf) {
      const ws = items.map(wf), total = ws.reduce((a, b) => a + b, 0);

      for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }

    // ---------- Flow ----------
    startGame(modeKey, wave = 1) {

    introWave(clearedNote) {

      this.drawSpace(true);

      const first = !clearedNote && this.wave === this.startWave;
      let what;
      if (cfg.newKeys) {
        const ks = [...cfg.newKeys];
        const finger = FINGER_NAMES[FINGER[physKey(ks[0])]].toLowerCase();

      } else if (cfg.mode === 'pairs') what = 'New: some vampires carry two-letter words.';

        ? `\n\nCareful aim! Each wrong key costs ${WRONG_COST} points. ${JAM_AFTER} in a row jam your crossbow for ${JAM_MS / 1000} seconds. ${MUTANT_AFTER} in one wave bring the Mega Mutant!` : '';
      const bossLine = rulesLine + (cfg.boss ? '\nWatch out: a boss shows up at the end! Type all of its words to chase it off.' : '') +

          : '';

        title: (this.practice ? 'Practice: ' : '') + (clearedNote ? `Wave ${this.wave - 1} cleared!` : `Wave ${this.wave}`),
        body: practiceLine + sessionLine + (skipped ? warmLine : '') + (clearedNote ? clearedNote + '\n\n' : '') + (clearedNote ? `Next up, wave ${this.wave}. ` : '') + what + '\n' + cfg.tip + bossLine + (skipped ? '' : warmLine),
        footer: first ? 'SPACE to start   ·   ESC for menu   ·   Grown-ups: ← → change wave' : 'Press SPACE when you are ready   ·   ESC for menu',

    }
    sessionCheer() {
      this.sessionCheered = true;
